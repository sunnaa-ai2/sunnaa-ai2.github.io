name: backend

on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**']
  workflow_dispatch:

jobs:
  test-sqlite:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_sqlite, sqlite3, mbstring, fileinfo, gd, intl', coverage: none }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env   # tests take their settings from phpunit.xml
      - run: php artisan test

  test-mysql:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      mysql:
        image: mysql:8.0
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: sunnaa_test }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: sunnaa_test
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql, mbstring, fileinfo, gd, intl', coverage: none }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: touch .env   # tests take their settings from phpunit.xml
      - run: php artisan test
      - name: Fresh migrate + rollback on MySQL
        run: php artisan migrate:fresh --force && php artisan migrate:rollback --force

  docker:
    runs-on: ubuntu-latest
    needs: [test-sqlite, test-mysql]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sunnaa-ai2-api backend
