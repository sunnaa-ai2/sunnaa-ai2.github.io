name: composer-lock

# Resolves backend/composer.json into backend/composer.lock and commits it,
# so the server installs exactly the versions the tests ran against.
on:
  workflow_dispatch:
  push:
    paths: ['backend/composer.json', '.github/workflows/composer-lock.yml']

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql, mbstring, fileinfo, gd, intl', coverage: none }
      - run: composer update --no-interaction --no-progress --no-install
      - name: Commit the lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          git diff --cached --quiet || { git commit -m "backend: update composer.lock"; git push; }
