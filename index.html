<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark صُنّاع AI 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#12559B; --blue-d:#0d4176; --yellow:#FFCC00; --orange:#FF8022; --green:#00BC3A;
  --bg:#F3F5F9; --card:#fff; --ink:#1b2333; --muted:#667085; --line:#e4e8ef; --red:#d92d20;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
a{color:var(--blue);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand img{height:38px;width:auto}
.brand b{font-size:18px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.85;font-weight:500;margin-top:-4px}
.nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a,.nav button{color:#fff;background:transparent;border:0;padding:7px 11px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.12)}
.nav .pill{background:var(--yellow);color:#1b2333;font-weight:700}
.nav .pill:hover{background:#ffd633}
.stripe{display:flex;height:5px}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--green)}
.stripe i:nth-child(2){background:var(--yellow)}
.stripe i:nth-child(3){background:var(--orange)}
.menu-btn{display:none}

.demo-bar{background:#fff7d6;border-bottom:1px solid #f2e2a0;font-size:14px}
.demo-bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px;padding-bottom:8px}
.demo-bar select{padding:4px 8px;border-radius:8px;border:1px solid #e0cf86;background:#fff}

main{padding:22px 0 60px}
.hero{background:linear-gradient(135deg,var(--blue) 0%,#1a6bc0 100%);color:#fff;border-radius:22px;padding:26px 24px;position:relative;overflow:hidden;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:28px;font-weight:800}
.hero p{margin:0;opacity:.92;max-width:560px}
.hero .dots{position:absolute;left:18px;top:16px;display:grid;grid-template-columns:repeat(3,14px);gap:8px;opacity:.9}
.hero .dots i{width:14px;height:14px;border-radius:50%;display:block}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 14px}
.stat b{font-size:20px;margin-inline-end:6px}

.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:20px;font-weight:800}
.sec-title .d{display:flex;gap:4px}
.sec-title .d i{width:9px;height:9px;border-radius:50%;display:block}
.sec-title .grow{flex:1}

.search{width:100%;max-width:340px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trainee{padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:transform .15s,box-shadow .15s;color:inherit}
.trainee:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(18,85,155,.12)}
.trainee .name{font-weight:700;font-size:17px}
.trainee .bio{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.chip{display:inline-flex;align-items:center;gap:5px;background:#eef4fb;color:var(--blue);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.chip.admin{background:#fff3e8;color:#c55a0c}

.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800}

.work{display:flex;flex-direction:column;color:inherit;transition:transform .15s,box-shadow .15s}
.work:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(18,85,155,.12)}
.thumb{aspect-ratio:4/3;background:#eef2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-weight:700;padding:10px;text-align:center;word-break:break-all}
.thumb.pdf{background:var(--orange)}
.thumb.link{background:var(--green)}
.badge-no{position:absolute;top:10px;right:10px;background:var(--blue);color:#fff;border-radius:10px;padding:3px 10px;font-weight:700;font-size:14px}
.wacts{display:flex;gap:6px;padding:0 12px 12px}
.wacts .btn{flex:1}
.danger{border-color:#f4c7c3}
.danger h2{color:var(--red)}
.cur{display:flex;align-items:center;gap:10px;background:#f4f6fa;border-radius:12px;padding:10px;margin-bottom:10px}
.cur img{width:64px;height:48px;object-fit:cover;border-radius:8px}
.work .meta{padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.work .meta .who{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;flex:1;min-width:0}
.work .meta .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{display:inline-flex;align-items:center;gap:3px}

.profile-head{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
.profile-head h1{margin:0;font-size:24px}
.profile-head p{margin:4px 0 0;color:var(--muted)}
.profile-head .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;font-size:15px}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4f8fd}
.btn.warn{background:#fff;color:var(--red);border:1px solid #f4c7c3}
.btn.warn:hover{background:#fff4f3}
.btn.yellow{background:var(--yellow);color:#1b2333}
.btn.green{background:var(--green)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:10px}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:19px}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
.in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}
.in:focus{outline:2px solid #bcd6f2;border-color:var(--blue)}
textarea.in{min-height:90px;resize:vertical}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.seg{display:flex;gap:6px;background:#eef2f7;padding:4px;border-radius:12px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.viewer{background:#0f1723;display:flex;align-items:center;justify-content:center;min-height:220px}
.viewer img{max-height:75vh;width:auto;display:block}
.bigtile{width:100%;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;text-align:center}
.bigtile.pdf{background:var(--orange)}
.bigtile.link{background:var(--green)}
.bigtile .u{word-break:break-all;opacity:.9;font-size:14px}

.react{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--ink)}
.rbtn.on.up{background:#e7f8ee;border-color:#9fe0b6;color:#067a2a}
.rbtn.on.down{background:#fff0e6;border-color:#ffc49a;color:#b64d00}
.rbtn:disabled{cursor:default}

.comments{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.cm{display:flex;gap:10px}
.cm .bubble{background:#f4f6fa;border-radius:14px;padding:9px 13px;flex:1;min-width:0}
.cm .bubble b{font-size:14px}
.cm .bubble time{color:var(--muted);font-size:12px;margin-inline-start:6px}
.cm .bubble p{margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}
.cm .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}

.table{width:100%;border-collapse:collapse;font-size:15px}
.table td,.table th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.table th{color:var(--muted);font-weight:500;font-size:13px}
.st{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.ok{background:#e7f8ee;color:#067a2a}
.st.wait{background:#fff8db;color:#8a6d00}

.invite-out{background:#f4f8fd;border:1px dashed #9cc0e6;border-radius:12px;padding:14px;margin-top:14px}
.invite-out code{display:block;direction:ltr;text-align:left;word-break:break-all;background:#fff;border-radius:8px;padding:8px;font-size:13px;margin:8px 0}

.empty{text-align:center;color:var(--muted);padding:34px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.notice{background:#eef4fb;border-radius:12px;padding:12px 14px;color:#24456b;font-size:15px}
.notice.err{background:#fff1f0;color:#a5241a}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:11px 18px;border-radius:12px;z-index:100;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:18px;padding:22px;max-width:400px;width:100%}
.modal p{margin:0 0 16px;font-size:17px}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 0 30px}

@media (max-width:720px){
  .brand small{display:none}
  .menu-btn{display:inline-flex;margin-inline-start:auto;background:transparent;border:0;color:#fff;padding:8px;cursor:pointer}
  .nav{display:none;position:absolute;top:64px;right:0;left:0;background:var(--blue-d);flex-direction:column;align-items:stretch;padding:8px 12px 14px}
  .nav.open{display:flex}
  .nav a,.nav button{text-align:right;padding:11px 12px}
  .hero h1{font-size:23px}
  .hero .dots{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
  .trainee{padding:14px 10px}
  .profile-head .acts{margin-inline-start:0;width:100%}
}
</style>
</head>

/* ---------- helpers: files ---------- */
function compressImage(file, max=1600, q=.85){
  return new Promise((res, rej) => {
    if (file.type === 'image/gif') return res(file);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('IMG')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('IMG')); };
    img.src = url;
  });
}
const toDataUrl = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });

/* =========================================================
   Backend 2: Supabase (الموقع الحقيقي)
   ========================================================= */
function SupaApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { flowType:'implicit', persistSession:true, detectSessionInUrl:true, autoRefreshToken:true }
  });
  let user = null, admin = false, listener = null;
  const chk = ({data, error}) => { if (error) throw error; return data; };
  async function loadAuth(){
    const { data:{ session } } = await sb.auth.getSession();
    user = session ? { id:session.user.id, email:(session.user.email||'').toLowerCase() } : null;
    admin = false;
    if (user) { const { data } = await sb.rpc('is_admin'); admin = !!data; }
  }
  async function upload(file, kind, folderMax){
    let blob = file, ext = 'pdf', type = 'application/pdf';
    if (kind === 'image' || kind === 'avatar') {
      blob = await compressImage(file, kind === 'avatar' ? 400 : (folderMax || 1600), .85);
      type = blob.type || 'image/jpeg'; ext = type === 'image/gif' ? 'gif' : 'jpg';
    } else if (file.size > 10*1024*1024) throw new Error('حجم ملف PDF أكبر من 10MB');
    const path = `${user.id}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    chk(await sb.storage.from('uploads').upload(path, blob, { contentType:type, upsert:false }));
    return { path, url: sb.storage.from('uploads').getPublicUrl(path).data.publicUrl };
  }
  const rmFile = async p => { if (p) await sb.storage.from('uploads').remove([p]); };
  return {
    demo: false,
    async init(){
      await loadAuth();
      sb.auth.onAuthStateChange(ev => {
        if (['SIGNED_IN','SIGNED_OUT','USER_UPDATED'].includes(ev)) setTimeout(() => loadAuth().then(() => listener && listener()), 0);
      });
    },
    onChange(cb){ listener = cb; },
    user: () => user,
    isAdmin: () => admin,
    async signIn(email, pw){ chk(await sb.auth.signInWithPassword({ email:email.trim().toLowerCase(), password:pw })); },
    async signUp(email, pw){
      const d = chk(await sb.auth.signUp({ email:email.trim().toLowerCase(), password:pw }));
      if (!d.session) { if (d.user && !(d.user.identities || []).length) throw new Error('User already registered'); throw new Error('EMAIL_CONFIRM_ON'); }
    },
    async changePassword(pw){ chk(await sb.auth.updateUser({ password:pw })); },
    async adminSetPassword(id, pw){ chk(await sb.rpc('admin_set_password', { p_user:id, p_password:pw })); },
    async logout(){ await sb.auth.signOut(); },
    async profiles(){ return chk(await sb.from('profiles').select('*').order('created_at')); },
    async works(){ return chk(await sb.from('works').select('*').order('created_at')); },
    async reactions(){ return chk(await sb.from('reactions').select('work_id,user_id,value')); },
    async commentCounts(){ const rows = chk(await sb.from('comments').select('work_id')); const c = {}; rows.forEach(r => c[r.work_id] = (c[r.work_id]||0)+1); return c; },
    async comments(workId){ return chk(await sb.from('comments').select('*').eq('work_id', workId).order('created_at')); },
    async react(workId, value){
      if (!value) chk(await sb.from('reactions').delete().eq('work_id', workId).eq('user_id', user.id));
      else chk(await sb.from('reactions').upsert({ work_id:workId, user_id:user.id, value }, { onConflict:'work_id,user_id' }));
    },
    async addComment(workId, body){ chk(await sb.from('comments').insert({ work_id:workId, user_id:user.id, body })); },
    async delComment(id){ chk(await sb.from('comments').delete().eq('id', id)); },
    async saveProfile(fields, avatar){
      const upd = { ...fields };
      if (avatar) upd.avatar_url = (await upload(avatar, 'avatar')).url;
      chk(await sb.from('profiles').update(upd).eq('id', user.id));
    },
    async addWork({exercise_no, kind, url, file}){
      let file_path = null;
      if (kind !== 'link') { const up = await upload(file, kind); url = up.url; file_path = up.path; }
      chk(await sb.from('works').insert({ user_id:user.id, exercise_no, kind, url, file_path }));
    },
    async updateWork(id, {exercise_no, kind, url, file, old}){
      const upd = { exercise_no, updated_at:new Date().toISOString() };
      if (kind) {
        upd.kind = kind; upd.file_path = null; upd.url = url;
        if (kind !== 'link') { const up = await upload(file, kind); upd.url = up.url; upd.file_path = up.path; }
      }
      chk(await sb.from('works').update(upd).eq('id', id));
      if (kind && old?.file_path) await rmFile(old.file_path);
    },
    async delWork(w){ chk(await sb.from('works').delete().eq('id', w.id)); await rmFile(w.file_path); },
    async join(token, name){ chk(await sb.rpc('join_with_invite', { p_token: token || null, p_name: name })); },
    async invites(){ return chk(await sb.from('invites').select('*').order('created_at', { ascending:false })); },
    async createInvite(email){ return chk(await sb.from('invites').insert({ email:email.trim().toLowerCase() }).select().single()); },
    async delInvite(token){ chk(await sb.from('invites').delete().eq('token', token)); },
    async delMember(id){
      const paths = (await sb.from('works').select('file_path').eq('user_id', id)).data?.map(r => r.file_path).filter(Boolean) || [];
      const av = (await sb.from('profiles').select('avatar_url').eq('id', id).single()).data?.avatar_url;
      const avp = av && av.split('/uploads/')[1]; if (avp) paths.push(decodeURIComponent(avp));
      if (paths.length) await sb.storage.from('uploads').remove(paths);
      chk(await sb.rpc('admin_delete_member', { p_user:id }));
    },
    async deleteMyAccount(){
      const paths = (await sb.from('works').select('file_path').eq('user_id', user.id)).data?.map(r => r.file_path).filter(Boolean) || [];
      const av = (await sb.from('profiles').select('avatar_url').eq('id', user.id).single()).data?.avatar_url;
      const avp = av && av.split('/uploads/')[1]; if (avp) paths.push(decodeURIComponent(avp));
      if (paths.length) await sb.storage.from('uploads').remove(paths);
      chk(await sb.rpc('delete_my_account'));
      await sb.auth.signOut();
    },
  };
}

  const m = String(e?.message || e || '');
  const map = {
    INVITE_INVALID:'رابط الدعوة غير صالح أو تم حذفه.',
    INVITE_USED:'رابط الدعوة هذا استُخدم من قبل. كل رابط يعمل لمرة واحدة فقط.',
    INVITE_EMAIL_MISMATCH:'رابط الدعوة هذا مخصص لبريد إلكتروني آخر. سجّل الدخول بنفس البريد الذي وصلته الدعوة عليه.',
    INVITE_REQUIRED:'لا يمكنك الانضمام بدون رابط دعوة.',
    NOT_LOGGED_IN:'يجب تسجيل الدخول أولًا.',
    FORBIDDEN:'ليس لديك صلاحية لهذا الإجراء.',
    'Invalid login credentials':'الإيميل أو كلمة المرور غلط.',
    'User already registered':'هذا البريد عنده حساب مسبقًا. اختار "تسجيل الدخول".',
    'already been registered':'هذا البريد عنده حساب مسبقًا. اختار "تسجيل الدخول".',
    'Email not confirmed':'تأكيد البريد مفعّل في إعدادات Supabase. يجب إيقاف خيار Confirm email.',
    'EMAIL_CONFIRM_ON':'تأكيد البريد مفعّل في إعدادات Supabase. يجب إيقاف خيار Confirm email.',
    'WEAK_PASSWORD':'كلمة المرور لازم تكون 8 أحرف أو أكثر.',
    'Password should be':'كلمة المرور ضعيفة، استخدم 8 أحرف أو أكثر.',
    'CANNOT_DELETE_SELF':'ما بتقدر تحذف حسابك من هون، استخدم صفحة حسابي.',
    'rate limit':'محاولات كثيرة، حاول بعد قليل.',
    'duplicate key':'هذا العنصر موجود مسبقًا.',
  };
  for (const k in map) if (m.includes(k)) return map[k];
  return m || 'حدث خطأ غير متوقع';
}
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function confirmBox(msg, okText='تأكيد'){
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><p>${esc(msg)}</p><div class="row"><button class="btn warn" data-ok>${esc(okText)}</button><button class="btn ghost" data-no>إلغاء</button></div></div>`;
    bg.onclick = e => { if (e.target === bg || e.target.dataset.no !== undefined) { bg.remove(); res(false); } if (e.target.dataset.ok !== undefined) { bg.remove(); res(true); } };
    document.body.appendChild(bg);
  });
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast('تم النسخ'); }
  catch(e) { toast('لم يتم النسخ تلقائيًا — انسخ الرابط يدويًا'); }
}

const avatar = (p, size=44) => {
  if (p?.avatar_url) return `<img class="avatar" src="${esc(safeUrl(p.avatar_url))}" alt="" style="width:${size}px;height:${size}px">`;
  const n = (p?.full_name || '؟').trim();
  return `<span class="avatar" style="width:${size}px;height:${size}px;background:${hashColor(p?.id||n)};font-size:${Math.round(size*.42)}px">${esc(n.charAt(0))}</span>`;
};
function counts(workId){
  let up = 0, down = 0, mine = 0; const u = me();
  S.reactions.forEach(r => { if (r.work_id !== workId) return; r.value === 1 ? up++ : down++; if (u && r.user_id === u.id) mine = r.value; });
  return { up, down, mine };
}
function canSeeDislikes(w){ const u = me(); return !!u && (u.id === w.user_id || api.isAdmin()); }

function workForm(w){
  const editing = !!w;
  $('#app').innerHTML = `
    <a class="back" href="${editing ? '#w-'+w.id : '#u-'+me().id}">${ICON.back}رجوع</a>
    <div class="panel"><h2>${editing ? 'تعديل التمرين' : 'إضافة تمرين جديد'}</h2>
      <form id="wf">
        <label for="no">رقم التمرين</label>
        <input class="in" id="no" type="number" min="1" max="999" inputmode="numeric" required value="${editing ? esc(w.exercise_no) : ''}" style="max-width:160px">
        ${editing ? `<label>المحتوى الحالي</label><div class="cur">${w.kind === 'image' ? `<img src="${esc(safeUrl(w.url))}" alt="">` : ''}<div><b>${w.kind === 'image' ? 'صورة' : w.kind === 'pdf' ? 'ملف PDF' : 'رابط'}</b>${w.kind === 'link' ? `<div class="hint" dir="ltr" style="margin:0;word-break:break-all">${esc(w.url)}</div>` : ''}</div></div>` : ''}
        <label>${editing ? 'استبدال المحتوى (اختياري)' : 'نوع العمل'}</label>
        <div id="contentBox">
          <div class="seg" id="seg"><button type="button" data-k="image">صورة</button><button type="button" data-k="pdf">ملف PDF</button><button type="button" data-k="link">رابط</button></div>
          <div id="kindIn" style="margin-top:12px"></div>
          ${editing ? `<div class="hint">اترك الحقل فارغًا إذا بدك تغيّر رقم التمرين بس.</div>` : ''}
        </div>
        <div class="notice err" id="ferr" style="display:none;margin-top:12px"></div>
        <div class="row" style="margin-top:18px"><button class="btn" id="sbtn">${editing ? 'حفظ التعديلات' : 'نشر التمرين'}</button></div>
      </form>
    </div>`;
  let kind = editing ? w.kind : 'image';
  const drawKind = () => {
    $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === kind));
    $('#kindIn').innerHTML = kind === 'link'
      ? `<input class="in" id="url" type="url" dir="ltr" placeholder="https://…" value="${editing && w.kind === 'link' ? esc(w.url) : ''}"><div class="hint">مثال: رابط مشروع، رابط Canva، رابط محادثة أو موقع.</div>`
      : `<input class="in" id="file" type="file" accept="${kind === 'image' ? 'image/png,image/jpeg,image/webp,image/gif' : 'application/pdf'}"><div class="hint">${kind === 'image' ? 'PNG أو JPG أو WEBP — يتم ضغط الصورة تلقائيًا.' : 'الحد الأقصى 10MB.'}</div>`;
  };
  drawKind();
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => { kind = b.dataset.k; drawKind(); });
  $('#wf').onsubmit = async e => {
    e.preventDefault();
    const err = m => { $('#ferr').textContent = m; $('#ferr').style.display = ''; };
    $('#ferr').style.display = 'none';
    const exercise_no = parseInt($('#no').value, 10);
    if (!(exercise_no >= 1 && exercise_no <= 999)) return err('اكتب رقم تمرين صحيح.');
    let withContent = !editing;
    if (editing) {
      if (kind === 'link') { const v = ($('#url').value || '').trim(); withContent = !!v && !(w.kind === 'link' && v === w.url); }
      else withContent = !!$('#file').files[0];
    }
    let data = { exercise_no };
    if (withContent) {
      data.kind = kind;
      if (kind === 'link') {
        const url = ($('#url').value || '').trim();
        if (!/^https?:\/\/\S+\.\S+/i.test(url)) return err('اكتب رابطًا صحيحًا يبدأ بـ https://');
        data.url = url;
      } else {
        const f = $('#file').files[0];
        if (!f) return err('اختر ملفًا.');
        if (kind === 'image' && !f.type.startsWith('image/')) return err('الملف المختار ليس صورة.');
        if (kind === 'pdf' && f.type !== 'application/pdf') return err('الملف المختار ليس PDF.');
        data.file = f;
      }
    }
    const btn = $('#sbtn'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
    try {
      if (editing) { data.old = w; await api.updateWork(w.id, data); toast('تم حفظ التعديلات'); await refresh(false); location.hash = '#w-' + w.id; }
      else { await api.addWork(data); toast('تم نشر التمرين 🎉'); await refresh(false); location.hash = '#u-' + me().id; }
    } catch(er) { err(errMsg(er)); btn.disabled = false; btn.textContent = editing ? 'حفظ التعديلات' : 'نشر التمرين'; }
  };
}

        <div class="row">${avatar(p,84)}<div><label for="av" style="margin-top:0">الصورة الشخصية</label><input id="av" type="file" accept="image/*"><div class="hint">مربعة يفضّل — يتم ضغطها تلقائيًا.</div></div></div>
        <label for="fn">الاسم</label><input class="in" id="fn" maxlength="60" required value="${esc(p.full_name)}">
        <label for="bio">نبذة قصيرة</label><textarea class="in" id="bio" maxlength="300" placeholder="عرّف عن نفسك في سطرين…">${esc(p.bio||'')}</textarea>
        <div class="row" style="margin-top:16px"><button class="btn" id="pbtn">حفظ</button><a class="btn ghost" href="#u-${p.id}">عرض صفحتي</a></div>
      </form>
    </div>
    <div class="panel"><h2>تغيير كلمة المرور</h2>
      <form id="cpf" class="row"><input class="in" id="npw" type="password" dir="ltr" minlength="8" required placeholder="كلمة المرور الجديدة (8 أحرف أو أكثر)" autocomplete="new-password" style="flex:1;min-width:200px"><button class="btn ghost">تغيير</button></form>
    </div>
    <div class="panel danger"><h2>حذف الحساب</h2>
      <p style="margin:0 0 12px">رح ينحذف ملفك الشخصي وكل أعمالك وتعليقاتك وتفاعلاتك نهائيًا. ما بتقدر ترجع للمنصة إلا برابط دعوة جديد.</p>
      <button class="btn warn" id="delAcc">حذف حسابي نهائيًا</button>
    </div>
    <div class="hint">مسجّل الدخول بـ <span dir="ltr">${esc(u.email)}</span>${api.isAdmin() ? ' · <span class="chip admin">أدمن</span>' : ''}</div>`;
  $('#cpf').onsubmit = async e => {
    e.preventDefault(); const pw = $('#npw').value;
    if (pw.length < 8) return toast('كلمة المرور لازم تكون 8 أحرف أو أكثر');
    try { await api.changePassword(pw); $('#npw').value = ''; toast('تم تغيير كلمة المرور'); } catch(er) { toast(errMsg(er)); }
  };
  $('#delAcc').onclick = async () => {
    if (!await confirmBox('متأكد إنك بدك تحذف حسابك؟ هاد الإجراء ما بينرجع عنه، وكل أعمالك وتعليقاتك رح تنحذف.', 'نعم، احذف حسابي')) return;
    const b = $('#delAcc'); b.disabled = true; b.textContent = 'جاري الحذف…';
    try { await api.deleteMyAccount(); toast('تم حذف حسابك'); location.hash = '#home'; await refresh(); }
    catch(er) { toast(errMsg(er)); b.disabled = false; b.textContent = 'حذف حسابي نهائيًا'; }
  };
  $('#pf').onsubmit = async e => {
    e.preventDefault();
    const full_name = $('#fn').value.trim(); if (full_name.length < 2) return toast('اكتب اسمك');
    const btn = $('#pbtn'); btn.disabled = true;
    try { await api.saveProfile({ full_name, bio:$('#bio').value.trim() }, $('#av').files[0] || null); toast('تم الحفظ'); await refresh(); }
    catch(er) { toast(errMsg(er)); btn.disabled = false; }
  };
}

function viewLogin(){
  if (me()) { location.hash = myProfile() ? '#me' : '#join'; return; }
  let mode = pendingInvite ? 'up' : 'in';
  $('#app').innerHTML = `
    <div class="panel" style="max-width:480px;margin:10px auto">
      <div class="seg" id="lseg" style="margin-bottom:6px"><button type="button" data-m="in">تسجيل الدخول</button><button type="button" data-m="up">إنشاء حساب</button></div>
      <div id="lnote"></div>
      <form id="lf">
        <label for="em">البريد الإلكتروني</label><input class="in" id="em" type="email" dir="ltr" required autocomplete="email" placeholder="name@gmail.com">
        <label for="pw">كلمة المرور</label><input class="in" id="pw" type="password" dir="ltr" required minlength="8" autocomplete="current-password">
        <div id="pw2box"><label for="pw2">تأكيد كلمة المرور</label><input class="in" id="pw2" type="password" dir="ltr" minlength="8" autocomplete="new-password"></div>
        <div class="row" style="margin-top:14px"><button class="btn" id="lbtn"></button></div>
      </form>
      <div id="lmsg" style="margin-top:12px"></div>
      <p class="hint">نسيت كلمة المرور؟ تواصل مع المدرب أو مسؤول المنصة ليعيّن لك كلمة جديدة.<br>الزوار يستطيعون تصفح الموقع بدون تسجيل.</p>
    </div>`;
  const draw = () => {
    $('#lseg').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
    $('#pw2box').style.display = mode === 'up' ? '' : 'none';
    $('#pw2').required = mode === 'up';
    $('#pw').autocomplete = mode === 'up' ? 'new-password' : 'current-password';
    $('#lbtn').textContent = mode === 'up' ? 'إنشاء الحساب' : 'دخول';
    $('#lnote').innerHTML = mode === 'up'
      ? `<div class="notice" style="margin:8px 0">${pendingInvite ? 'وصلتك دعوة 🎉 اعمل حسابك بنفس البريد اللي وصلتك عليه الدعوة.' : 'إنشاء الحساب مفيد فقط إذا وصلتك دعوة أو كنت مسؤولًا. افتح رابط الدعوة من بريدك أولًا.'}</div>`
      : (pendingInvite ? `<div class="notice" style="margin:8px 0">لديك رابط دعوة. إذا عندك حساب ادخل فيه، وإلا اختار "إنشاء حساب".</div>` : '');
    $('#lmsg').innerHTML = '';
  };
  draw();
  $('#lseg').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.m; draw(); });
  $('#lf').onsubmit = async e => {
    e.preventDefault();
    const email = $('#em').value.trim(), pw = $('#pw').value, btn = $('#lbtn');
    if (pw.length < 8) { $('#lmsg').innerHTML = `<div class="notice err">كلمة المرور لازم تكون 8 أحرف أو أكثر.</div>`; return; }
    if (mode === 'up' && pw !== $('#pw2').value) { $('#lmsg').innerHTML = `<div class="notice err">كلمتا المرور غير متطابقتين.</div>`; return; }
    btn.disabled = true;
    try { mode === 'up' ? await api.signUp(email, pw) : await api.signIn(email, pw); }
    catch(er) { $('#lmsg').innerHTML = `<div class="notice err">${esc(errMsg(er))}</div>`; }
    btn.disabled = false;
  };
}
function promptBox(msg, okText='حفظ'){
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><p>${esc(msg)}</p><input class="in" type="text" dir="ltr" minlength="8" style="margin-bottom:14px"><div class="row"><button class="btn" data-ok>${esc(okText)}</button><button class="btn ghost" data-no>إلغاء</button></div></div>`;
    const inp = bg.querySelector('input');
    bg.onclick = e => { if (e.target === bg || e.target.dataset.no !== undefined) { bg.remove(); res(null); } if (e.target.dataset.ok !== undefined) { bg.remove(); res(inp.value); } };
    document.body.appendChild(bg); inp.focus();
  });
}

function viewJoin(){
  const u = me();
  if (!u) return viewLogin();
  if (myProfile()) { location.hash = '#me'; return; }
  const adm = api.isAdmin();
  if (!pendingInvite && !adm) {
    $('#app').innerHTML = `<div class="panel" style="max-width:520px;margin:10px auto"><h2>حسابك غير مدعو</h2>
      <p>أنت مسجّل الدخول بـ <b dir="ltr">${esc(u.email)}</b>، لكن هذا البريد ليس عضوًا في المنصة.</p>
      <div class="notice">الانضمام يتم فقط عن طريق رابط دعوة يرسله لك المدرب أو مسؤول المنصة على بريدك. افتح الرابط من الإيميل.</div>
      <p class="hint">تقدر تتصفح المتدربين وأعمالهم كزائر.</p></div>`;
    return;
  }
  $('#app').innerHTML = `<div class="panel" style="max-width:520px;margin:10px auto">
    <h2>${adm && !pendingInvite ? 'إنشاء ملفك كأدمن' : 'أهلًا بك في صُنّاع AI 2 👋'}</h2>
    <p class="hint" style="font-size:15px">${pendingInvite ? 'تم التحقق من رابط الدعوة. اكتب اسمك كما تريد أن يظهر للجميع.' : 'كأدمن تقدر تنشئ ملفًا شخصيًا لتنشر أعمالك أيضًا (اختياري).'}</p>
    <form id="jf"><label for="jn">الاسم الكامل</label><input class="in" id="jn" maxlength="60" required>
    <div class="row" style="margin-top:14px"><button class="btn" id="jbtn">إنشاء ملفي</button></div></form>
    <div id="jmsg" style="margin-top:12px"></div></div>`;
  $('#jf').onsubmit = async e => {
    e.preventDefault();
    const name = $('#jn').value.trim(); if (name.length < 2) return;
    const btn = $('#jbtn'); btn.disabled = true;
    try {
      await api.join(pendingInvite, name);
      clearInvite(); toast('تم إنشاء ملفك!');
      await refresh(false); location.hash = '#me';
    } catch(er) {
      $('#jmsg').innerHTML = `<div class="notice err">${esc(errMsg(er))}</div>`; btn.disabled = false;
      if (/INVITE_(USED|INVALID)/.test(String(er?.message))) clearInvite();
    }
  };
}

async function viewAdmin(){
  if (!api.isAdmin()) return notFound('هذه الصفحة للمسؤولين فقط.');
  $('#app').innerHTML = `
    <div class="panel"><h2>دعوة متدرب جديد</h2>
      <p class="hint" style="font-size:15px">اكتب بريد المتدرب. سيتم إنشاء رابط خاص به يعمل مرة واحدة فقط، ولا يقبله إلا نفس هذا البريد.</p>
      <form id="inf" class="row"><input class="in" id="iem" type="email" dir="ltr" required placeholder="trainee@gmail.com" style="flex:1;min-width:220px"><button class="btn">إنشاء رابط دعوة</button></form>
      <div id="iout"></div>
    </div>
    <div class="panel"><h2>الدعوات</h2><div id="ilist" class="hint">جاري التحميل…</div></div>
    <div class="panel"><h2>الأعضاء (${S.profiles.length})</h2>
      <table class="table"><tbody>${S.profiles.map(p => `<tr><td><a class="row" href="#u-${p.id}" style="color:inherit">${avatar(p,32)}<b>${esc(p.full_name)}</b></a></td><td style="color:var(--muted)">${S.works.filter(w=>w.user_id===p.id).length} عمل</td><td style="text-align:left">${p.id !== me()?.id ? `<button class="btn ghost sm" data-pw="${p.id}">كلمة مرور جديدة</button>` : ''}</td></tr>`).join('') || '<tr><td>لا يوجد أعضاء بعد.</td></tr>'}</tbody></table>
      <p class="hint">لإزالة عضو افتح صفحته واضغط "إزالة العضو". إذا نسي متدرب كلمة المرور اضغط "كلمة مرور جديدة" وأعطه إياها.</p>
    </div>`;
  $('#app').querySelectorAll('[data-pw]').forEach(b => b.onclick = async () => {
    const p = prof(b.dataset.pw);
    const pw = await promptBox(`اكتب كلمة مرور جديدة لـ ${p?.full_name || 'العضو'} (8 أحرف أو أكثر)، وأعطه إياها:`);
    if (pw == null) return;
    if (pw.length < 8) return toast('كلمة المرور لازم تكون 8 أحرف أو أكثر');
    try { await api.adminSetPassword(b.dataset.pw, pw); toast('تم تعيين كلمة المرور الجديدة'); } catch(e) { toast(errMsg(e)); }
  });
  const inviteLink = t => location.origin + location.pathname + '?invite=' + t;
  const gmail = (email, link) => 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(email)
    + '&su=' + encodeURIComponent('دعوة للانضمام إلى منصة صُنّاع AI 2 — Spark')
    + '&body=' + encodeURIComponent(`مرحبًا،\n\nتمت دعوتك للانضمام إلى منصة "صُنّاع AI 2" لعرض تمارينك وتصاميمك مع متدربي سبارك.\n\nرابط الدعوة الخاص بك (يعمل مرة واحدة فقط ومع هذا البريد فقط):\n${link}\n\nافتح الرابط، اختر "إنشاء حساب" واكتب بريدك هذا وكلمة مرور من اختيارك، ثم اكتب اسمك.\n\nبالتوفيق!`);
  const showOut = inv => {
    const link = inviteLink(inv.token);
    $('#iout').innerHTML = `<div class="invite-out"><b>رابط الدعوة لـ <span dir="ltr">${esc(inv.email)}</span></b><code>${esc(link)}</code>
      <div class="row"><a class="btn" href="${esc(gmail(inv.email, link))}" target="_blank" rel="noopener">إرسال عبر Gmail</a><button class="btn ghost" id="cpy">نسخ الرابط</button>
      ${api.demo ? `<button class="btn ghost" id="tryInv">تجربة الرابط (معاينة)</button>` : ''}</div>
      <div class="hint">زر Gmail يفتح رسالة جاهزة من بريدك — راجعها واضغط إرسال.</div></div>`;
    $('#cpy').onclick = () => copy(link);
    const t = $('#tryInv'); if (t) t.onclick = () => { pendingInvite = inv.token; api.switchTo(''); toast('سجّل الدخول ببريد الدعوة لتجربة الانضمام'); location.hash = '#login'; };
  };
  const drawInv = async () => {
    let list; try { list = await api.invites(); } catch(e) { $('#ilist').innerHTML = `<div class="notice err">${esc(errMsg(e))}</div>`; return; }
    $('#ilist').innerHTML = list.length ? `<table class="table"><thead><tr><th>البريد</th><th>الحالة</th><th></th></tr></thead><tbody>${list.map(i => `
      <tr><td dir="ltr" style="text-align:right;word-break:break-all">${esc(i.email)}</td>
      <td>${i.used_at ? `<span class="st ok">تم الانضمام</span>` : `<span class="st wait">بانتظار</span>`}<div class="hint" style="margin:2px 0 0">${fmtDate(i.created_at)}</div></td>
      <td style="white-space:nowrap">${i.used_at ? '' : `<button class="btn ghost sm" data-show="${i.token}">الرابط</button> `}<button class="btn warn sm" data-del="${i.token}">حذف</button></td></tr>`).join('')}</tbody></table>`
      : 'لا توجد دعوات بعد.';
    $('#ilist').querySelectorAll('[data-show]').forEach(b => b.onclick = () => { showOut(list.find(i => i.token === b.dataset.show)); $('#iout').scrollIntoView({behavior:'smooth',block:'center'}); });
    $('#ilist').querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!await confirmBox('حذف هذه الدعوة؟ الرابط لن يعمل بعد الآن (لا يؤثر على عضو انضم مسبقًا).', 'حذف')) return;
      try { await api.delInvite(b.dataset.del); drawInv(); } catch(e) { toast(errMsg(e)); }
    });
  };
  drawInv();
  $('#inf').onsubmit = async e => {
    e.preventDefault();
    const email = $('#iem').value.trim().toLowerCase();
    try { const inv = await api.createInvite(email); showOut(inv); $('#iem').value = ''; drawInv(); } catch(er) { toast(errMsg(er)); }
  };
}

function notFound(msg){ $('#app').innerHTML = `<div class="empty">${esc(msg)}<br><br><a class="btn ghost" href="#home">الرئيسية</a></div>`; }

/* ---------- router ---------- */
function route(){
  $('#nav').classList.remove('open');
  const h = location.hash.replace(/^#/, '');
  window.scrollTo(0, 0);
  if (!S.loaded) return;
  if (!h || h === 'home') return viewHome();
  if (h.startsWith('u-')) return viewProfile(h.slice(2));
  if (h.startsWith('w-')) return viewWork(h.slice(2));
  if (h === 'login') return viewLogin();
  if (h === 'join') return viewJoin();
  if (h === 'me') return viewMe();
  if (h === 'admin') return viewAdmin();
  if (h === 'add') { if (!myProfile()) return viewMe(); return workForm(null); }
  if (h.startsWith('edit-')) {
    const w = S.works.find(x => x.id === h.slice(5));
    if (!w || (w.user_id !== me()?.id && !api.isAdmin())) return notFound('لا يمكنك تعديل هذا العمل.');
    return workForm(w);
  }
  viewHome();
}
async function refresh(rerender=true){
  try { await loadAll(); }
  catch(e) { $('#app').innerHTML = `<div class="notice err">تعذّر تحميل البيانات: ${esc(errMsg(e))}</div>`; return; }
  renderNav(); renderDemoBar();
  if (rerender) route();
}
function clearInvite(){
  pendingInvite = null;
  try { localStorage.removeItem('spark_pending_invite'); } catch(e) {}
  if (location.search.includes('invite=')) history.replaceState(null, '', location.pathname + location.hash);
}

async function start(){
  $('#menuBtn').onclick = () => $('#nav').classList.toggle('open');
  // رابط الدعوة ?invite=TOKEN
  const qs = new URLSearchParams(location.search);
  try { pendingInvite = qs.get('invite') || localStorage.getItem('spark_pending_invite') || null; if (pendingInvite) localStorage.setItem('spark_pending_invite', pendingInvite); } catch(e) { pendingInvite = qs.get('invite'); }
  if (DEMO) api = MockApi();
  else {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); })
      .catch(() => { $('#app').innerHTML = '<div class="notice err">تعذّر تحميل مكتبة Supabase. تحقق من الاتصال.</div>'; throw new Error('lib'); });
    api = SupaApi();
  }
  await api.init();
  // تنظيف بقايا رابط الدخول من العنوان
  if (/access_token|error_description|error=/.test(location.hash)) {
    const m = decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g,' ');
    history.replaceState(null, '', location.pathname + location.search);
    if (m) toast('رابط الدخول منتهي أو غير صالح، اطلب رابطًا جديدًا');
  }
  api.onChange(async () => { await refresh(false); route(); });
  await refresh(false);
  if (pendingInvite && !myProfile()) location.hash = me() ? '#join' : '#login';
  route();
  window.addEventListener('hashchange', route);
}
start();
</script>
