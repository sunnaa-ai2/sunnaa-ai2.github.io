<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark صُنّاع AI 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#12559B; --blue-d:#0d4176; --yellow:#FFCC00; --orange:#FF8022; --green:#00BC3A;
  --bg:#F3F5F9; --card:#fff; --ink:#1b2333; --muted:#667085; --line:#e4e8ef; --red:#d92d20;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6}
a{color:var(--blue);text-decoration:none}
button,input,textarea,select{font-family:inherit;font-size:inherit}
img{max-width:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* header */
header.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand img{height:38px;width:auto}
.brand b{font-size:18px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:12px;opacity:.85;font-weight:500;margin-top:-4px}
.nav{margin-inline-start:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nav a,.nav button{color:#fff;background:transparent;border:0;padding:7px 11px;border-radius:10px;cursor:pointer;font-weight:500;font-size:15px}
.nav a:hover,.nav button:hover{background:rgba(255,255,255,.12)}
.nav .pill{background:var(--yellow);color:#1b2333;font-weight:700}
.nav .pill:hover{background:#ffd633}
.stripe{display:flex;height:5px}
.stripe i{flex:1}
.stripe i:nth-child(1){background:var(--green)}
.stripe i:nth-child(2){background:var(--yellow)}
.stripe i:nth-child(3){background:var(--orange)}
.menu-btn{display:none}

.demo-bar{background:#fff7d6;border-bottom:1px solid #f2e2a0;font-size:14px}
.demo-bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:8px;padding-bottom:8px}
.demo-bar select{padding:4px 8px;border-radius:8px;border:1px solid #e0cf86;background:#fff}

main{padding:22px 0 60px}
.hero{background:linear-gradient(135deg,var(--blue) 0%,#1a6bc0 100%);color:#fff;border-radius:22px;padding:26px 24px;position:relative;overflow:hidden;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:28px;font-weight:800}
.hero p{margin:0;opacity:.92;max-width:560px}
.hero .dots{position:absolute;left:18px;top:16px;display:grid;grid-template-columns:repeat(3,14px);gap:8px;opacity:.9}
.hero .dots i{width:14px;height:14px;border-radius:50%;display:block}
.stats{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.14);border-radius:12px;padding:8px 14px}
.stat b{font-size:20px;margin-inline-end:6px}

.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px;font-size:20px;font-weight:800}
.sec-title .d{display:flex;gap:4px}
.sec-title .d i{width:9px;height:9px;border-radius:50%;display:block}
.sec-title .grow{flex:1}

.search{width:100%;max-width:340px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.trainee{padding:18px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;transition:transform .15s,box-shadow .15s;color:inherit}
.trainee:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(18,85,155,.12)}
.trainee .name{font-weight:700;font-size:17px}
.trainee .bio{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.chip{display:inline-flex;align-items:center;gap:5px;background:#eef4fb;color:var(--blue);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700}
.chip.admin{background:#fff3e8;color:#c55a0c}

.avatar{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800}

.work{display:flex;flex-direction:column;color:inherit;transition:transform .15s,box-shadow .15s}
.work:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(18,85,155,.12)}
.thumb{aspect-ratio:4/3;background:#eef2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-weight:700;padding:10px;text-align:center;word-break:break-all}
.thumb.pdf,.thumb.file{background:var(--orange)}
.thumb.link{background:var(--green)}
.badge-no{position:absolute;top:10px;right:10px;background:var(--blue);color:#fff;border-radius:10px;padding:3px 10px;font-weight:700;font-size:14px}
.wacts{display:flex;gap:6px;padding:0 12px 12px}
.wacts .btn{flex:1}
.danger{border-color:#f4c7c3}
.danger h2{color:var(--red)}
.cur{display:flex;align-items:center;gap:10px;background:#f4f6fa;border-radius:12px;padding:10px;margin-bottom:10px}
.cur img{width:64px;height:48px;object-fit:cover;border-radius:8px}
.work .meta{padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.work .meta .who{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;flex:1;min-width:0}
.work .meta .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{display:inline-flex;align-items:center;gap:3px}

.profile-head{display:flex;gap:18px;align-items:center;padding:20px;flex-wrap:wrap}
.profile-head h1{margin:0;font-size:24px}
.profile-head p{margin:4px 0 0;color:var(--muted)}
.profile-head .acts{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff;font-size:15px}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--line)}
.btn.ghost:hover{background:#f4f8fd}
.btn.warn{background:#fff;color:var(--red);border:1px solid #f4c7c3}
.btn.warn:hover{background:#fff4f3}
.btn.yellow{background:var(--yellow);color:#1b2333}
.btn.green{background:var(--green)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:10px}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 12px;font-size:19px}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
.in{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe}
.in:focus{outline:2px solid #bcd6f2;border-color:var(--blue)}
textarea.in{min-height:90px;resize:vertical}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
.seg{display:flex;gap:6px;background:#eef2f7;padding:4px;border-radius:12px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.viewer{background:#0f1723;display:flex;align-items:center;justify-content:center;min-height:220px}
.viewer img{max-height:75vh;width:auto;display:block}
.bigtile{width:100%;padding:40px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;color:#fff;text-align:center}
.bigtile.pdf,.bigtile.file{background:var(--orange)}
.bigtile.link{background:var(--green)}
.bigtile .u{word-break:break-all;opacity:.9;font-size:14px}

.react{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--ink)}
.rbtn.on.up{background:#e7f8ee;border-color:#9fe0b6;color:#067a2a}
.rbtn.on.down{background:#fff0e6;border-color:#ffc49a;color:#b64d00}
.rbtn:disabled{cursor:default}

.comments{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.cm{display:flex;gap:10px}
.cm .bubble{background:#f4f6fa;border-radius:14px;padding:9px 13px;flex:1;min-width:0}
.cm .bubble b{font-size:14px}
.cm .bubble time{color:var(--muted);font-size:12px;margin-inline-start:6px}
.cm .bubble p{margin:2px 0 0;white-space:pre-wrap;word-wrap:break-word}
.cm .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px}

.table{width:100%;border-collapse:collapse;font-size:15px}
.table td,.table th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
.table th{color:var(--muted);font-weight:500;font-size:13px}
.st{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.st.ok{background:#e7f8ee;color:#067a2a}
.st.wait{background:#fff8db;color:#8a6d00}

.invite-out{background:#f4f8fd;border:1px dashed #9cc0e6;border-radius:12px;padding:14px;margin-top:14px}
.invite-out code{display:block;direction:ltr;text-align:left;word-break:break-all;background:#fff;border-radius:8px;padding:8px;font-size:13px;margin:8px 0}

.empty{text-align:center;color:var(--muted);padding:34px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
.notice{background:#eef4fb;border-radius:12px;padding:12px 14px;color:#24456b;font-size:15px}
.notice.err{background:#fff1f0;color:#a5241a}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2333;color:#fff;padding:11px 18px;border-radius:12px;z-index:100;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.2);max-width:90vw}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,35,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:#fff;border-radius:18px;padding:22px;max-width:400px;width:100%}
.modal p{margin:0 0 16px;font-size:17px}
.loading{text-align:center;color:var(--muted);padding:60px 0}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px;font-weight:700}
footer{text-align:center;color:var(--muted);font-size:13px;padding:20px 0 30px}

@media (max-width:720px){
  .brand small{display:none}
  .menu-btn{display:inline-flex;margin-inline-start:auto;background:transparent;border:0;color:#fff;padding:8px;cursor:pointer}
  .nav{display:none;position:absolute;top:64px;right:0;left:0;background:var(--blue-d);flex-direction:column;align-items:stretch;padding:8px 12px 14px}
  .nav.open{display:flex}
  .nav a,.nav button{text-align:right;padding:11px 12px}
  .hero h1{font-size:23px}
  .hero .dots{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
  .trainee{padding:14px 10px}
  .profile-head .acts{margin-inline-start:0;width:100%}
}

/* ================= v2 design ================= */
:root{--shadow:0 1px 2px rgba(16,40,80,.06),0 6px 20px rgba(16,40,80,.07);--shadow-h:0 10px 30px rgba(18,85,155,.16);--r:20px;--card2:#f7f9fc}
[data-theme=dark]{--bg:#0d1420;--card:#151f2e;--card2:#1b2738;--ink:#e8eef7;--muted:#93a1b5;--line:#243247;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
[data-theme=dark] .card,[data-theme=dark] .panel,[data-theme=dark] .modal{background:var(--card);border-color:var(--line)}
[data-theme=dark] .btn.ghost,[data-theme=dark] .rbtn,[data-theme=dark] .search,[data-theme=dark] .in,[data-theme=dark] .seg button.on{background:var(--card2);color:var(--ink);border-color:var(--line)}
[data-theme=dark] .seg,[data-theme=dark] .cm .bubble,[data-theme=dark] .cur,[data-theme=dark] .thumb{background:var(--card2)}
[data-theme=dark] .notice{background:#16304f;color:#cfe3fb}
[data-theme=dark] .chip{background:#1d3553;color:#9cc6f5}
[data-theme=dark] .empty{background:var(--card);border-color:var(--line)}
[data-theme=dark] header.top{background:#0f3a6b}
[data-theme=dark] a{color:#7fb6f0}
body{transition:background .25s,color .25s}
.card{box-shadow:var(--shadow);border-color:transparent}
header.top{box-shadow:0 4px 18px rgba(10,40,80,.18)}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.btn{transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn.lg{padding:13px 22px;font-size:16px;border-radius:14px}
.btn.glass{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn.glass:hover{background:rgba(255,255,255,.24)}

/* hero */
.hero2{position:relative;overflow:hidden;border-radius:28px;padding:44px 34px;color:#fff;margin-bottom:18px;display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:center;
  background:radial-gradient(circle at 15% 120%,rgba(0,188,58,.35),transparent 45%),radial-gradient(circle at 95% -10%,rgba(255,128,34,.45),transparent 45%),linear-gradient(135deg,#0f4a8a,#12559B 45%,#1b6fc6)}
.hero2::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
.eyebrow{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:12px}
.hero2 h1{font-size:40px;line-height:1.25;margin:0 0 10px;font-weight:800}
.hero2 .hl{background:linear-gradient(90deg,var(--yellow),#ffe680);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero2 p{font-size:17px;opacity:.92;margin:0 0 20px;max-width:520px}
.hero-art{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;justify-items:center;position:relative;z-index:1}
.hero-art i{width:46px;height:46px;border-radius:50%;display:block;animation:float 4s ease-in-out infinite;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.hero-art i:nth-child(2n){animation-delay:-1.3s}.hero-art i:nth-child(3n){animation-delay:-2.6s}
.hero-art i.s{width:26px;height:26px;opacity:.75}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hero-txt{position:relative;z-index:1}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:26px}
.kpi{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px}
.kpi .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.kpi b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.kpi span{color:var(--muted);font-size:14px}

/* tabs & chips */
.tabs{display:inline-flex;background:var(--card);box-shadow:var(--shadow);padding:5px;border-radius:16px;gap:4px;margin-bottom:16px}
.tabs button{border:0;background:transparent;padding:9px 18px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.search{border-radius:14px;box-shadow:var(--shadow);border-color:transparent;padding:12px 16px;max-width:380px}

/* trainee card v2 */
.tcard{display:flex;flex-direction:column;align-items:center;text-align:center;color:inherit;transition:transform .18s,box-shadow .18s;padding-bottom:16px}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.tcover{height:66px;width:100%;background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#fff));position:relative}
.tcover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.25) 1.5px,transparent 1.5px);background-size:12px 12px}
.ring{border:4px solid var(--card);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.tcard .avatar{margin-top:-38px;position:relative}
.tcard .name{font-weight:800;font-size:17px;margin-top:8px;padding:0 12px}
.tcard .bio{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;padding:0 14px;margin:2px 0 10px}
.tstats{display:flex;gap:6px;justify-content:center}
.tstats span{background:var(--card2);border-radius:10px;padding:4px 10px;font-size:13px;color:var(--muted)}
.tstats b{color:var(--ink);margin-inline-end:4px}

/* work card v2 */
.work{transition:transform .18s,box-shadow .18s}
.work:hover{transform:translateY(-4px);box-shadow:var(--shadow-h)}
.thumb{aspect-ratio:4/3}
.thumb img{transition:transform .4s}
.work:hover .thumb img{transform:scale(1.05)}
.badge-no{top:12px;right:12px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.kind-badge{position:absolute;bottom:10px;left:10px;background:rgba(15,23,35,.72);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:8px;backdrop-filter:blur(4px)}
.thumb.pdf,.thumb.file{background:linear-gradient(135deg,var(--orange),#ffa45c)}
.thumb.link{background:linear-gradient(135deg,var(--green),#4fd97a)}

/* profile v2 */
.pcard{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
.pcover{height:150px;background:linear-gradient(120deg,var(--c),#12559B);position:relative}
.pcover::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.22) 2px,transparent 2px);background-size:16px 16px}
.pcover .pdots{position:absolute;left:24px;bottom:18px;display:flex;gap:8px;z-index:1}
.pcover .pdots i{width:14px;height:14px;border-radius:50%;display:block}
.pbody{display:flex;gap:18px;align-items:flex-end;padding:0 24px 16px;flex-wrap:wrap}
.pbody .avatar{margin-top:-56px;position:relative}
.pinfo{flex:1;min-width:200px;padding-top:10px}
.pinfo h1{margin:0;font-size:26px}
.pinfo p{margin:4px 0;color:var(--muted)}
.pbody .acts{display:flex;gap:8px;flex-wrap:wrap}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
.pstats div{text-align:center;padding:14px 6px}
.pstats div+div{border-inline-start:1px solid var(--line)}
.pstats b{display:block;font-size:22px;font-weight:800}
.pstats span{color:var(--muted);font-size:13px}

/* timeline */
.timeline{position:relative;padding-inline-start:34px;display:flex;flex-direction:column;gap:18px}
.timeline::before{content:"";position:absolute;right:13px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--green),var(--yellow),var(--orange))}
.tl-item{position:relative;max-width:560px}
.tl-dot{position:absolute;right:-34px;top:2px;width:29px;height:29px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.tl-date{color:var(--muted);font-size:13px;font-weight:700;margin-bottom:6px}

/* work page */
.wnav{display:flex;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.viewer{cursor:zoom-in;border-radius:0}
.viewer img{transition:opacity .2s}
.lightbox{position:fixed;inset:0;background:rgba(5,10,18,.92);z-index:120;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:fade .2s}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lightbox .close{position:absolute;top:16px;left:16px}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--card2) 25%,var(--line) 37%,var(--card2) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;border-radius:16px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* footer v2 */
footer.ft{background:var(--card);margin-top:30px;padding:28px 0 90px;text-align:right;box-shadow:0 -1px 0 var(--line)}
.ft .wrap{display:flex;gap:24px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.ft .d{display:flex;gap:5px;margin-bottom:6px}.ft .d i{width:10px;height:10px;border-radius:50%;display:block}
.ft b{font-size:16px}.ft p{margin:2px 0;color:var(--muted);font-size:14px}

[data-theme=dark] .demo-bar{background:#2b2610;border-color:#4a3f12;color:#f3e3a3}
[data-theme=dark] .demo-bar select{background:#1b2738;color:#e8eef7;border-color:#4a3f12}

/* ================= 3D intro ================= */
#intro{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;overflow:hidden;perspective:1000px;
  background:radial-gradient(ellipse at 50% 35%,#1f78d1 0%,#12559B 38%,#082a52 100%);transition:opacity .7s ease,transform .8s cubic-bezier(.7,0,.3,1),filter .7s}
#intro.out{opacity:0;transform:scale(1.25);filter:blur(6px);pointer-events:none}
#intro .floor{position:absolute;left:-50%;bottom:-38%;width:200%;height:85%;transform:rotateX(76deg);transform-origin:50% 0;
  background-image:linear-gradient(rgba(255,255,255,.16) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(255,255,255,.16) 1.5px,transparent 1.5px);
  background-size:70px 70px;animation:floorMove 1.6s linear infinite;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000);mask-image:linear-gradient(transparent,#000 30%,#000)}
@keyframes floorMove{to{background-position:0 70px}}
#intro .glow{position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,204,0,.35),transparent 65%);filter:blur(20px);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
#intro .stage{position:relative;transform-style:preserve-3d;text-align:center;transition:transform 1s cubic-bezier(.6,0,.2,1)}
.spark-word{position:relative;display:inline-flex;direction:ltr;font-family:Tajawal,system-ui,sans-serif;font-weight:800;font-size:min(23vw,190px);line-height:1;color:#fff;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.6,0,.2,1)}
.spark-word span{display:inline-block;opacity:0;transform:rotateX(-110deg) translateZ(80px);transform-origin:50% 100%;animation:flipIn .9s cubic-bezier(.2,.9,.25,1.25) forwards;
  text-shadow:0 1px 0 #d9e7f7,0 2px 0 #c3d8f1,0 3px 0 #adc9ea,0 4px 0 #97bae3,0 5px 0 #81abdc,0 6px 0 #6b9cd5,0 8px 6px rgba(0,0,0,.25),0 18px 30px rgba(0,0,0,.35)}
@keyframes flipIn{to{opacity:1;transform:none}}
.dots3d{position:absolute;right:-.02em;top:-.38em;display:grid;grid-template-columns:repeat(3,.13em);gap:.05em;transform-style:preserve-3d}
.dots3d i{width:.13em;height:.13em;border-radius:50%;display:block;opacity:0;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.95),rgba(255,255,255,0) 42%),var(--c);box-shadow:0 .03em .06em rgba(0,0,0,.35);
  transform:translate3d(var(--x),var(--y),var(--z));animation:dotIn 1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:var(--d)}
@keyframes dotIn{60%{opacity:1}to{opacity:1;transform:none}}
.intro-sub{font-family:Tajawal,system-ui,sans-serif;color:#fff;font-weight:800;font-size:min(9vw,64px);margin-top:.35em;opacity:0;transform:rotateX(90deg) translateY(30px);transform-origin:50% 0;filter:blur(8px);transition:all .9s cubic-bezier(.2,.9,.25,1.1) .15s;text-shadow:0 3px 0 rgba(0,0,0,.15),0 12px 30px rgba(0,0,0,.3)}
.intro-sub b{color:var(--yellow)}
.intro-tag{font-family:Tajawal,system-ui,sans-serif;color:rgba(255,255,255,.75);letter-spacing:.35em;font-size:min(3.2vw,15px);margin-top:14px;opacity:0;transition:opacity .8s .6s;direction:ltr}
.intro-bar{display:flex;justify-content:center;gap:6px;margin-top:22px;opacity:0;transition:opacity .6s .8s}
.intro-bar i{width:46px;height:5px;border-radius:5px;display:block}
#intro.p2 .spark-word{transform:translateY(-.12em) scale(.5) rotateX(18deg)}
#intro.p2 .intro-sub{opacity:1;transform:none;filter:none}
#intro.p2 .intro-tag,#intro.p2 .intro-bar{opacity:1}
#intro .skip{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 18px;font-family:Tajawal,sans-serif;font-weight:700;cursor:pointer}
body.intro-on{overflow:hidden}

/* 3D spheres in hero + tilt */
.hero-art{perspective:700px;transform-style:preserve-3d;transition:transform .2s ease-out}
.hero-art i{background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,0) 40%),var(--c)!important;box-shadow:0 14px 28px rgba(0,0,0,.28),inset -6px -8px 14px rgba(0,0,0,.18)}
.hero-art i:nth-child(odd){transform:translateZ(40px)}
.tilt{transition:transform .08s linear!important;will-change:transform}
.tcard,.work{transform-style:preserve-3d}
@media (prefers-reduced-motion:reduce){#intro{display:none}.hero-art i{animation:none}}

/* ===== features v3 ===== */
.bell{position:relative;color:#fff;text-decoration:none}
.bell[hidden]{display:none}
#bellN{position:absolute;top:-4px;left:-4px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--blue)}

.spot{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;margin-bottom:26px}

.wow-img{aspect-ratio:auto;min-height:220px;height:100%}
.wow-body{padding:22px;display:flex;flex-direction:column;justify-content:center;gap:6px}

.eyebrow2{align-self:flex-start;background:linear-gradient(90deg,#ffe680,var(--yellow));color:#5a4300;font-weight:800;font-size:13px;padding:4px 12px;border-radius:999px}
.board{padding:18px}
.board h3{margin:0;font-size:18px}
.lb-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;color:inherit}

.lb-rank{width:26px;text-align:center;font-size:18px;font-weight:800;color:var(--muted)}
.lb-name{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-name small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.lb-score{background:#eef4fb;color:var(--blue);border-radius:10px;padding:2px 10px;font-size:14px}
[data-theme=dark] .lb-score{background:#1d3553;color:#9cc6f5}
.mini-badges{display:flex;gap:4px;justify-content:center;margin-top:8px;font-size:16px}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.bdg{background:var(--card2);border-radius:14px;padding:12px 8px;text-align:center;opacity:.5;filter:grayscale(1);transition:.2s}
.bdg.on{opacity:1;filter:none;background:linear-gradient(160deg,#fff7d6,#ffe9a8);box-shadow:0 4px 14px rgba(255,204,0,.25)}
[data-theme=dark] .bdg.on{background:linear-gradient(160deg,#3a3010,#4a3a0c)}
.bdg span{font-size:26px;display:block}
.bdg b{display:block;font-size:14px;margin-top:2px}
.bdg small{color:var(--muted);font-size:11.5px}
.exinfo{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px;margin-bottom:14px;border-inline-start:4px solid var(--orange)}
.exinfo p{margin:2px 0 0;color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exlink{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-weight:700;font-size:15px}
.exhead{display:flex;gap:20px;align-items:flex-start;color:#fff;border-radius:24px;padding:28px;margin-bottom:16px;position:relative;overflow:hidden;
  background:radial-gradient(circle at 100% 0,rgba(255,128,34,.5),transparent 50%),linear-gradient(135deg,#0f4a8a,#12559B 60%,#1b6fc6)}
.exhead::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:18px 18px;pointer-events:none}
.exhead>*{position:relative;z-index:1}
.exnum{flex:none;width:84px;height:84px;border-radius:24px;background:var(--yellow);color:#1b2333;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:rotate(-6deg)}
.exhead h1{margin:0 0 6px;font-size:28px}
.exdesc{margin:0;white-space:pre-wrap;opacity:.95;max-width:720px}
.btn.sm.glass{padding:6px 12px}
.nlist{display:flex;flex-direction:column;gap:4px}
.nitem{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;color:inherit}
.nitem:hover{background:var(--card2)}
.nitem.unread{background:#eef4fb}
[data-theme=dark] .nitem.unread{background:#16304f}
.ntxt{flex:1;min-width:0}
.ntxt small{display:block;color:var(--muted);font-size:12.5px}
.nic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.nic.like{background:var(--green)}.nic.comment{background:var(--orange)}
.thumb.pdfimg{background:#fff}
.thumb.pdfimg img{object-fit:cover;object-position:top}
.intro-ctrl{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
#intro .intro-ctrl .skip,#intro .intro-ctrl .snd{position:static;transform:none;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:7px 16px;font-family:Tajawal,sans-serif;font-weight:700;cursor:pointer}
@media (max-width:720px){
  .spot{grid-template-columns:1fr}

}

/* ================= AI-agents intro ================= */
#intro2{position:fixed;inset:0;z-index:300;background:#050506;overflow:hidden;font-family:Tajawal,system-ui,sans-serif;transition:opacity .6s ease,transform .7s cubic-bezier(.7,0,.3,1)}
#intro2.out{opacity:0;transform:scale(1.06);pointer-events:none}
.i2-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px}
.i2-glow{position:absolute;left:50%;top:55%;width:90vmax;height:60vmax;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,43,58,.28),transparent 60%);opacity:0;transition:opacity 1.2s}
#intro2.p2 .i2-glow{opacity:1}
.i2-svg{position:absolute;inset:0;width:100%;height:100%}
.i2-svg rect,.i2-svg line{fill:none;stroke:var(--c);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.6,0,.2,1) forwards;filter:drop-shadow(0 0 4px var(--c))}
@keyframes draw{to{stroke-dashoffset:0}}
#intro2.p2 .i2-svg rect,#intro2.p2 .i2-svg line{transition:opacity .8s;opacity:.55}
.i2-h{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;background:#050506;border:1.5px solid var(--c);opacity:0;animation:pop .3s forwards}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.i2-center{position:absolute;left:16%;top:27%;width:68%;height:30%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.i2-word{direction:ltr;font-weight:800;font-size:min(17vw,15vh,200px);line-height:.95;letter-spacing:-.02em;color:#ff2b3a;opacity:0;transform:scale(1.4);filter:blur(12px);
  text-shadow:0 0 30px rgba(255,43,58,.55),0 0 80px rgba(255,43,58,.35);transition:all .6s cubic-bezier(.2,.9,.3,1.15)}
#intro2.p2 .i2-word{opacity:1;transform:none;filter:none;animation:glitch .5s steps(2) .55s 1}
@keyframes glitch{0%{text-shadow:-4px 0 #00e5ff,4px 0 #ff2b3a}50%{text-shadow:4px 0 #00e5ff,-4px 0 #ffcc00;transform:skewX(-6deg)}100%{text-shadow:0 0 30px rgba(255,43,58,.55);transform:none}}
.i2-sub{color:#fff;font-weight:800;font-size:min(7vw,4.6vh,48px);margin-top:.4em;opacity:0;transform:translateY(16px);transition:all .6s ease}
.i2-sub b{color:#ff2b3a}
#intro2.p3 .i2-sub{opacity:1;transform:none}
.acur{position:absolute;left:0;top:0;display:flex;align-items:flex-start;gap:2px;pointer-events:none;z-index:5;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.acur span{background:var(--c);color:#111;font-size:12px;font-weight:800;padding:2px 8px;border-radius:7px;margin-top:14px;white-space:nowrap;font-family:Tajawal,system-ui,sans-serif}
.i2c{transform:translate(-20vw,-20vh)}
.i2-status{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#cfcfd6;border-radius:999px;padding:7px 16px;font-size:13px;white-space:nowrap;backdrop-filter:blur(6px)}
.i2-status b{color:#fff}
.i2-dots{display:flex}.i2-dots i{width:14px;height:14px;border-radius:50%;border:2px solid #050506;margin-inline-start:-5px;display:block}
.i2-sep{width:1px;height:12px;background:rgba(255,255,255,.2)}
#intro2 .intro-ctrl{bottom:26px}
#intro2 .intro-ctrl button{position:static;transform:none;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:999px;padding:7px 16px;font-family:Tajawal,sans-serif;font-weight:700;cursor:pointer}

/* build-on-scroll */
.bld{opacity:0;filter:blur(8px);transform:translateY(18px) scale(.98)}
.bld.bld-in{opacity:1;filter:none;transform:none;transition:opacity .5s ease,filter .5s ease,transform .5s cubic-bezier(.2,.9,.3,1.1)}
.bframe{position:absolute;z-index:60;pointer-events:none;transition:opacity .4s}
.bframe.done{opacity:0}
.bframe svg{position:absolute;inset:0;overflow:visible}
.bframe rect{fill:rgba(255,255,255,.02);stroke:var(--c);stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .55s cubic-bezier(.6,0,.2,1) forwards;filter:drop-shadow(0 0 4px var(--c))}
.bh{position:absolute;width:8px;height:8px;background:var(--bg);border:1.5px solid var(--c);animation:pop .25s .35s both}
.bsize{position:absolute;bottom:-24px;left:50%;transform:translateX(-50%);background:var(--c);color:#111;font-size:11px;font-weight:800;padding:1px 7px;border-radius:5px;direction:ltr;font-family:system-ui,sans-serif;animation:pop .25s .4s both}
#toTop{position:fixed;left:18px;bottom:22px;z-index:55;width:46px;height:46px;border-radius:14px;border:0;background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;opacity:0;transform:translateY(16px);pointer-events:none;transition:.25s;display:flex;align-items:center;justify-content:center}
#toTop.show{opacity:1;transform:none;pointer-events:auto}
@media (max-width:720px){ #toTop{bottom:92px;left:14px} .i2-status{bottom:76px;font-size:12px} .acur span{font-size:11px} }

@media (prefers-reduced-motion:reduce){ #intro2{display:none} .bld{opacity:1!important;filter:none!important;transform:none!important} }

/* ===== 15s intro phases ===== */
.i2-zoom{position:absolute;inset:0;transform-origin:50% 40%;transition:transform 1.1s cubic-bezier(.7,0,.3,1),opacity 1.1s,filter 1.1s}
#intro2.p6 .i2-zoom{transform:scale(2.4);opacity:0;filter:blur(6px)}
#intro2 .i2-svg rect,#intro2 .i2-svg line{animation-duration:1.4s}
#intro2.p2 .i2-svg rect,#intro2.p2 .i2-svg line{opacity:.7}
#intro2.p5 .i2-svg rect,#intro2.p5 .i2-svg line{stroke:#ff2b3a;opacity:1;filter:drop-shadow(0 0 6px #ff2b3a);transition:stroke .6s,opacity .6s}
#intro2.p5 .i2-h{border-color:#ff2b3a}
.i2-fill{position:absolute;padding:1.4vh 1.2vw;display:flex;flex-direction:column;gap:1vh;justify-content:flex-end;overflow:hidden}
.i2-fill.nav{flex-direction:row;align-items:center;justify-content:space-between;padding:0 1.4vw}
.i2-fill i{display:block;opacity:0;transform:scaleX(.2);transform-origin:right;transition:opacity .45s var(--d),transform .6s cubic-bezier(.2,.9,.3,1.1) var(--d)}
#intro2.p4 .i2-fill i{opacity:1;transform:none}
.f-img{flex:1;min-height:0;border-radius:8px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#000),color-mix(in srgb,var(--c) 25%,#000));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.f-l{height:1.1vh;min-height:6px;border-radius:4px;background:rgba(255,255,255,.22)}
.f-btn{width:38%;height:2.6vh;min-height:14px;border-radius:6px;background:#ff2b3a}
.f-btn.sm{width:70px;height:2vh}
.f-logo{width:3.4vh;height:3.4vh;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,var(--c))}
.f-nav{display:flex;gap:12px;align-items:center}
#intro2.p5 .f-btn{box-shadow:0 0 14px rgba(255,43,58,.7)}
.i2-scan{position:absolute;left:0;right:0;top:-20%;height:20%;background:linear-gradient(180deg,transparent,rgba(255,43,58,.18) 70%,rgba(255,43,58,.6) 98%,transparent);opacity:0;pointer-events:none}
#intro2.p5 .i2-scan{animation:scan 1.6s cubic-bezier(.6,0,.4,1) forwards}
@keyframes scan{0%{top:-20%;opacity:1}100%{top:110%;opacity:1}}
#intro2.p4 .i2-word{transform:translateY(-.08em) scale(.82)}
#intro2.p5 .i2-word{animation:pulseRed 1s ease-in-out 2}
@keyframes pulseRed{50%{text-shadow:0 0 50px rgba(255,43,58,.95),0 0 120px rgba(255,43,58,.6)}}
.i2-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.i2-prog i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2b3a,#ff7a50);transform-origin:right;transform:scaleX(0);animation:prog 14.3s linear forwards}
@keyframes prog{to{transform:scaleX(1)}}
.i2-center{left:16%;top:23%;width:68%;height:34%}
@media (max-width:720px){ .i2-status{font-size:11px;gap:6px;padding:6px 12px;max-width:94vw} .i2-dots{display:none} .i2-fill{padding:1vh 2vw} .f-nav .f-l{width:24px!important} .f-btn.sm{width:40px} }
/* Lenis (from lenis.css) */
html.lenis,html.lenis body{height:auto}
.lenis:not(.lenis-autoToggle).lenis-stopped{overflow:clip}
.lenis [data-lenis-prevent]{overscroll-behavior:contain}
.lenis.lenis-smooth iframe{pointer-events:none}
/* bottom nav (mobile) */
.bnav{display:none}
@media (max-width:720px){
  .hero2{grid-template-columns:1fr;padding:30px 22px;border-radius:22px}
  .hero2 h1{font-size:28px}
  .hero-art{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .nav,.menu-btn{display:none!important}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:50;background:var(--card);box-shadow:0 -4px 20px rgba(0,0,0,.08);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:center}
  .bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);background:none;border:0;padding:4px;cursor:pointer}
  .bnav a.on{color:var(--blue)}
  .bnav .plus{flex:none;width:52px;height:52px;border-radius:18px;background:var(--yellow);color:#1b2333;margin-top:-26px;box-shadow:0 8px 20px rgba(255,204,0,.45);justify-content:center}
  main{padding-bottom:90px}
  .pcover{height:110px}
  .pinfo h1{font-size:22px}
  .timeline{padding-inline-start:30px}
}
</style>

/* ---------- helpers: files ---------- */
function compressImage(file, max=1600, q=.85){
  return new Promise((res, rej) => {
    if (file.type === 'image/gif') return res(file);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('IMG')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('IMG')); };
    img.src = url;
  });
}
const toDataUrl = blob => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(blob); });

      db.comments = db.comments.filter(c=>c.user_id!==id && !wids.includes(c.work_id));
      db.users = db.users.filter(u=>u.id!==id); db.session = null; save(); fire();

}

/* =========================================================
   Backend 2: Supabase (الموقع الحقيقي)
   ========================================================= */
function SupaApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
    auth: { flowType:'implicit', persistSession:true, detectSessionInUrl:true, autoRefreshToken:true }
  });
  let user = null, admin = false, listener = null;
  const chk = ({data, error}) => { if (error) throw error; return data; };
  async function loadAuth(){
    const { data:{ session } } = await sb.auth.getSession();
    user = session ? { id:session.user.id, email:(session.user.email||'').toLowerCase() } : null;
    admin = false;
    if (user) { const { data } = await sb.rpc('is_admin'); admin = !!data; }
  }
  async function upload(file, kind, folderMax){
    let blob = file, ext, type;
    if (kind === 'image' || kind === 'avatar') {
      blob = await compressImage(file, kind === 'avatar' ? 400 : (folderMax || 1600), .85);
      type = blob.type || 'image/jpeg'; ext = type === 'image/gif' ? 'gif' : 'jpg';
    } else {
      if (file.size > 50*1024*1024) throw new Error('حجم الملف أكبر من 50MB');
      const m = /\.([a-z0-9]{1,10})$/i.exec(file.name || '');
      ext = m ? m[1].toLowerCase() : 'bin';
      type = file.type || 'application/octet-stream';
      // ملفات قد تُشغَّل كصفحة في المتصفح (HTML/SVG/JS…) تُرفع كتنزيل فقط، للأمان
      if (/html|svg|xml|javascript|ecmascript/i.test(type) || /^(html?|svg|xhtml|xml|js|mjs)$/.test(ext)) type = 'application/octet-stream';
    }
    const path = `${user.id}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
    chk(await sb.storage.from('uploads').upload(path, blob, { contentType:type, upsert:false }));
    return { path, url: sb.storage.from('uploads').getPublicUrl(path).data.publicUrl };
  }
  const rmFile = async p => { if (p) await sb.storage.from('uploads').remove([p]); };
  return {
    demo: false,
    async init(){
      await loadAuth();
      sb.auth.onAuthStateChange(ev => {
        if (['SIGNED_IN','SIGNED_OUT','USER_UPDATED'].includes(ev)) setTimeout(() => loadAuth().then(() => listener && listener()), 0);
      });
    },
    onChange(cb){ listener = cb; },
    user: () => user,
    isAdmin: () => admin,
    async sendLink(email, token){
      const redirect = location.origin + location.pathname + (token ? '?invite=' + encodeURIComponent(token) : '');
      chk(await sb.auth.signInWithOtp({ email:email.trim().toLowerCase(), options:{ emailRedirectTo: redirect, shouldCreateUser:true } }));
    },
    async logout(){ await sb.auth.signOut(); },
    async profiles(){ return chk(await sb.from('profiles').select('*').order('created_at')); },
    async works(){ return chk(await sb.from('works').select('*').order('created_at')); },
    async reactions(){ return chk(await sb.from('reactions').select('work_id,user_id,value,created_at')); },
    async commentRows(){ return chk(await sb.from('comments').select('work_id,user_id')); },
    async exercises(){ return chk(await sb.from('exercises').select('*').order('no')); },
    async saveExercise(no, title, description){ chk(await sb.from('exercises').upsert({ no, title, description, updated_at:new Date().toISOString() }, { onConflict:'no' })); },

/* ---------- PDF thumbnails (pdf.js) ---------- */
let pdfLibP = null; const pdfCache = {};
function loadPdfLib(){
  if (!pdfLibP) pdfLibP = new Promise((res, rej) => {
    const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); };
    sc.onerror = () => { pdfLibP = null; rej(new Error('pdfjs')); }; document.head.appendChild(sc);
  });
  return pdfLibP;
}
function pdfThumb(url){
  if (!pdfCache[url]) pdfCache[url] = (async () => {
    const lib = await loadPdfLib(); const doc = await lib.getDocument({ url }).promise; const pg = await doc.getPage(1);
    const v1 = pg.getViewport({ scale:1 }), vp = pg.getViewport({ scale: 520 / v1.width });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: ctx, viewport: vp }).promise; doc.destroy();
    return c.toDataURL('image/jpeg', .82);
  })();
  return pdfCache[url];
}
function hydratePdf(){
  document.querySelectorAll('[data-pdf]:not([data-pdf-done])').forEach(el => {
    el.dataset.pdfDone = '1';
    const io = new IntersectionObserver(ents => {
      if (!ents.some(e => e.isIntersecting)) return; io.disconnect();
      pdfThumb(el.dataset.pdf).then(src => { const ph = el.querySelector('.ph'); if (ph) { const im = new Image(); im.src = src; im.alt = ''; ph.replaceWith(im); el.classList.add('pdfimg'); } }).catch(() => {});
    }, { rootMargin:'200px' });
    io.observe(el);
  });
}

/* ---------- intro sound (WebAudio, no files) ---------- */
function introSfx(){
  try {
    const A = new (window.AudioContext || window.webkitAudioContext)(), t = A.currentTime;
    const len = Math.floor(A.sampleRate * .7), buf = A.createBuffer(1, len, A.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = A.createBufferSource(); src.buffer = buf;
    const f = A.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(3200, t + .55);
    const g = A.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.45, t + .18); g.gain.exponentialRampToValueAtTime(.0001, t + .7);
    src.connect(f).connect(g).connect(A.destination); src.start(t);
    [523.25, 659.25, 783.99, 1046.5].forEach((fr, i) => {
      const o = A.createOscillator(), gg = A.createGain(), st = t + .55 + i * .11;
      o.type = 'sine'; o.frequency.value = fr; gg.gain.setValueAtTime(.0001, st); gg.gain.exponentialRampToValueAtTime(.22, st + .02); gg.gain.exponentialRampToValueAtTime(.0001, st + .9);
      o.connect(gg).connect(A.destination); o.start(st); o.stop(st + 1);
    });
  } catch(e) {}
}

      </div>
    </div>

    $('#react').innerHTML = `

      <button class="rbtn down ${c.mine===-1?'on':''}" data-v="-1" ${dis?'disabled':''}>${ICON.down}<span>عدم إعجاب</span>${canSeeDislikes(w) ? `<b>${c.down}</b>` : ''}</button>
      ${!canSeeDislikes(w) && member ? `<span class="hint" style="margin:0">عدد عدم الإعجاب يظهر لصاحب العمل فقط</span>` : ''}`;
    $('#react').querySelectorAll('.rbtn').forEach(b => b.onclick = async () => {
      if (!member) return;
      const v = +b.dataset.v, nv = c.mine === v ? 0 : v;
      S.reactions = S.reactions.filter(r => !(r.work_id === w.id && r.user_id === u.id));
      if (nv) S.reactions.push({ work_id:w.id, user_id:u.id, value:nv });
      drawReact();
      try { await api.react(w.id, nv); } catch(e) { toast(errMsg(e)); S.reactions = await api.reactions(); drawReact(); }

    const close = () => { lb.remove(); document.removeEventListener('keydown', esc_); };
    const esc_ = e => { if (e.key === 'Escape') close(); };
    lb.onclick = close; document.addEventListener('keydown', esc_); document.body.appendChild(lb);
  };
  const drawComments = async () => {
    let list = [];

function workForm(w){
  const editing = !!w;
  $('#app').innerHTML = `

    <div class="panel"><h2>${editing ? 'تعديل التمرين' : 'إضافة تمرين جديد'}</h2>

        ${editing ? `<label>المحتوى الحالي</label><div class="cur">${w.kind === 'image' ? `<img src="${esc(safeUrl(w.url))}" alt="">` : ''}<div><b>${w.kind === 'image' ? 'صورة' : w.kind === 'link' ? 'رابط' : esc(fileLabel(w))}</b>${w.kind === 'link' ? `<div class="hint" dir="ltr" style="margin:0;word-break:break-all">${esc(w.url)}</div>` : ''}</div></div>` : ''}
        <label>${editing ? 'استبدال المحتوى (اختياري)' : 'نوع العمل'}</label>
        <div id="contentBox">
          <div class="seg" id="seg"><button type="button" data-k="image">صورة</button><button type="button" data-k="file">ملف (أي صيغة)</button><button type="button" data-k="link">رابط</button></div>
          <div id="kindIn" style="margin-top:12px"></div>
          ${editing ? `<div class="hint">اترك الحقل فارغًا إذا بدك تغيّر رقم التمرين بس.</div>` : ''}
        </div>
        <div class="notice err" id="ferr" style="display:none;margin-top:12px"></div>
        <div class="row" style="margin-top:18px"><button class="btn" id="sbtn">${editing ? 'حفظ التعديلات' : 'نشر التمرين'}</button></div>
      </form>
    </div>`;
  let kind = editing ? (w.kind === 'pdf' ? 'file' : w.kind) : 'image';
  const drawKind = () => {
    $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === kind));
    $('#kindIn').innerHTML = kind === 'link'
      ? `<input class="in" id="url" type="url" dir="ltr" placeholder="https://…" value="${editing && w.kind === 'link' ? esc(w.url) : ''}"><div class="hint">مثال: رابط مشروع، رابط Canva، رابط محادثة أو موقع.</div>`
      : `<input class="in" id="file" type="file" ${kind === 'image' ? 'accept="image/png,image/jpeg,image/webp,image/gif"' : ''}><div class="hint">${kind === 'image' ? 'PNG أو JPG أو WEBP — يتم ضغط الصورة تلقائيًا.' : 'أي صيغة: PDF، Word، PowerPoint، Excel، ZIP، فيديو، كود… الحد الأقصى 50MB.'}</div>`;
  };
  drawKind();
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => { kind = b.dataset.k; drawKind(); });
  $('#wf').onsubmit = async e => {
    e.preventDefault();
    const err = m => { $('#ferr').textContent = m; $('#ferr').style.display = ''; };
    $('#ferr').style.display = 'none';
    const exercise_no = parseInt($('#no').value, 10);
    if (!(exercise_no >= 1 && exercise_no <= 999)) return err('اكتب رقم تمرين صحيح.');
    let withContent = !editing;
    if (editing) {
      if (kind === 'link') { const v = ($('#url').value || '').trim(); withContent = !!v && !(w.kind === 'link' && v === w.url); }
      else withContent = !!$('#file').files[0];
    }
    let data = { exercise_no };
    if (withContent) {
      data.kind = kind;
      if (kind === 'link') {
        const url = ($('#url').value || '').trim();
        if (!/^https?:\/\/\S+\.\S+/i.test(url)) return err('اكتب رابطًا صحيحًا يبدأ بـ https://');
        data.url = url;
      } else {
        const f = $('#file').files[0];
        if (!f) return err('اختر ملفًا.');
        if (kind === 'image' && !f.type.startsWith('image/')) return err('الملف المختار ليس صورة.');
        if (kind === 'file' && f.size > 50*1024*1024) return err('حجم الملف أكبر من 50MB.');
        data.file = f;
      }
    }
    const btn = $('#sbtn'); btn.disabled = true; btn.textContent = 'جاري الحفظ…';
    try {
      if (editing) { data.old = w; await api.updateWork(w.id, data); toast('تم حفظ التعديلات'); await refresh(false); location.hash = '#w-' + w.id; }
      else { await api.addWork(data); toast('تم نشر التمرين 🎉'); await refresh(false); location.hash = '#u-' + me().id; }
    } catch(er) { err(errMsg(er)); btn.disabled = false; btn.textContent = editing ? 'حفظ التعديلات' : 'نشر التمرين'; }
  };
}

/* ---------- router ---------- */
function route(){
  if (S.loaded) renderNav();
  $('#nav').classList.remove('open');
  const h = location.hash.replace(/^#/, '');
  scrollTop0();
  if (!S.loaded) return;
  if (!h || h === 'home') return viewHome();
  if (h.startsWith('u-')) return viewProfile(h.slice(2));
  if (h.startsWith('w-')) return viewWork(h.slice(2));
  if (h === 'login') return viewLogin();
  if (h === 'join') return viewJoin();
  if (h === 'me') return viewMe();
  if (h === 'admin') return viewAdmin();
  if (h === 'notifs') return viewNotifs();
  if (h.startsWith('ex-')) return viewExercise(parseInt(h.slice(3), 10));
  if (h === 'add') { if (!myProfile()) return viewMe(); return workForm(null); }
  if (h.startsWith('edit-')) {
    const w = S.works.find(x => x.id === h.slice(5));
    if (!w || (w.user_id !== me()?.id && !api.isAdmin())) return notFound('لا يمكنك تعديل هذا العمل.');
    return workForm(w);
  }
  viewHome();
}

/* sections get "built" by agents as they scroll into view (first visit only) */
let buildIO = null, buildQ = 0, agentN = 0;
function prepareBuild(){
  if (!BUILD) return;
  const ts = [...$('#app').querySelectorAll('.hero2, .kpi, .spot > *, .tabs, .toolbar, #tgrid > *, #wgrid > *')].slice(0, 30);
  ts.forEach(t => t.classList.add('bld'));
  introDone.then(() => {
    if (!BUILD) return;
    buildIO = new IntersectionObserver(ents => ents.forEach(e => { if (e.isIntersecting) { buildIO.unobserve(e.target); queueBuild(e.target); } }), { threshold:.15 });
    ts.forEach(t => buildIO.observe(t));
    setTimeout(autoTour, 500);
    setTimeout(() => document.querySelectorAll('.bld').forEach(t => { t.classList.add('bld-in'); setTimeout(() => t.classList.remove('bld','bld-in'), 700); }), 20000);
  });
}
function queueBuild(t){
  const now = performance.now(), at = Math.max(now, buildQ + 170); buildQ = at;
  setTimeout(() => runBuild(t), at - now);
}
function runBuild(t){
  const r = t.getBoundingClientRect(), a = AGENTS[agentN++ % AGENTS.length];
  const f = document.createElement('div'); f.className = 'bframe';
  f.style.cssText = `top:${r.top + scrollY}px;left:${r.left + scrollX}px;width:${r.width}px;height:${r.height}px;--c:${a.c}`;
  f.innerHTML = `<svg width="${r.width}" height="${r.height}"><rect x="1" y="1" width="${Math.max(0, r.width-2)}" height="${Math.max(0, r.height-2)}" rx="16" pathLength="1"/></svg>
    <i class="bh" style="top:-4px;left:-4px"></i><i class="bh" style="top:-4px;right:-4px"></i><i class="bh" style="bottom:-4px;left:-4px"></i><i class="bh" style="bottom:-4px;right:-4px"></i>
    <span class="bsize">${Math.round(r.width)} × ${Math.round(r.height)}</span>${cursorEl(a)}`;
  document.body.appendChild(f);
  f.querySelector('.acur').animate([{ transform:`translate(${r.width - 16}px, -12px)` }, { transform:`translate(${r.width * .45}px, ${r.height * .55}px)` }, { transform:`translate(6px, ${r.height - 18}px)` }], { duration:900, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
  setTimeout(() => t.classList.add('bld-in'), 420);
  setTimeout(() => f.classList.add('done'), 1050);
  setTimeout(() => { f.remove(); t.classList.remove('bld', 'bld-in'); }, 1500);
}
/* the page scrolls itself to the end once (Lenis); any touch / wheel / key stops it */
function autoTour(){
  if (!BUILD || (location.hash && location.hash !== '#home')) { BUILD = false; return; }
  const se = document.scrollingElement, from = se.scrollTop, to = se.scrollHeight - innerHeight;
  if (to - from < 50) { BUILD = false; return; }
  const dur = Math.min(13000, Math.max(4000, (to - from) / 260 * 1000));
  const ease = k => .5 - Math.cos(Math.PI * k) / 2;
  const evs = ['wheel','touchstart','pointerdown','keydown'];
  let stop = false;
  const done = () => { BUILD = false; evs.forEach(ev => removeEventListener(ev, cancel)); };
  const cancel = () => { if (stop) return; stop = true; if (lenis) { lenis.stop(); lenis.start(); } done(); };
  evs.forEach(ev => addEventListener(ev, cancel, { once:true, passive:true }));
  if (lenis) { lenis.scrollTo(to, { duration: dur / 1000, easing: ease, force:true, onComplete: () => { if (!stop) done(); } }); return; }
  const t0 = performance.now();
  const step = t => { if (stop) return; const k = Math.min(1, (t - t0) / dur); se.scrollTop = from + (to - from) * ease(k); if (k < 1) requestAnimationFrame(step); else done(); };
  requestAnimationFrame(step);
}
function setup3D(){
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  let cur = null;
  document.addEventListener('pointermove', e => {
    const art = e.target.closest('.hero2');
    const ha = document.querySelector('.hero-art');
    if (ha) { if (art) { const r = art.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5; ha.style.transform = `rotateY(${px*22}deg) rotateX(${-py*22}deg)`; } else ha.style.transform = ''; }
    const c = e.target.closest('.tcard, .work');
    if (cur && cur !== c) { cur.style.transform = ''; cur.classList.remove('tilt'); cur = null; }
    if (!c) return;
    const r = c.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    c.classList.add('tilt'); c.style.transform = `perspective(900px) rotateY(${px*12}deg) rotateX(${-py*12}deg) translateY(-4px)`; cur = c;
  });
}
async function start(){
  initLenis(); playIntro(); setup3D();
  addEventListener('scroll', () => $('#toTop').classList.toggle('show', scrollY > 700), { passive:true });
  $('#toTop').onclick = () => smoothTo(0, { duration:1.6 });
  let pdfT; new MutationObserver(() => { clearTimeout(pdfT); pdfT = setTimeout(hydratePdf, 60); }).observe($('#app'), { childList:true, subtree:true });
  setInterval(async () => { if (!api || !myProfile() || document.hidden) return; try { S.notifs = await api.notifications(); renderNav(); } catch(e) {} }, 60000);
  document.documentElement.dataset.theme = 'dark';
  $('#replayIntro').onclick = e => { e.preventDefault(); scrollTop0(); if (playIntro(true)) { location.hash = '#home'; route(); } };
  $('#menuBtn').onclick = () => $('#nav').classList.toggle('open');
  // رابط الدعوة ?invite=TOKEN
  const qs = new URLSearchParams(location.search);
  try { pendingInvite = qs.get('invite') || localStorage.getItem('spark_pending_invite') || null; if (pendingInvite) localStorage.setItem('spark_pending_invite', pendingInvite); } catch(e) { pendingInvite = qs.get('invite'); }
  if (DEMO) api = MockApi();
  else {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = res; s.onerror = rej; document.head.appendChild(s); })
      .catch(() => { $('#app').innerHTML = '<div class="notice err">تعذّر تحميل مكتبة Supabase. تحقق من الاتصال.</div>'; throw new Error('lib'); });
    api = SupaApi();
  }
  await api.init();
  // تنظيف بقايا رابط الدخول من العنوان
  if (/access_token|error_description|error=/.test(location.hash)) {
    const m = decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g,' ');
    history.replaceState(null, '', location.pathname + location.search);
    if (m) toast('رابط الدخول منتهي أو غير صالح، اطلب رابطًا جديدًا');
  }
  api.onChange(async () => { await refresh(false); route(); });
  await refresh(false);
  if (pendingInvite && !myProfile()) location.hash = me() ? '#join' : '#login';
  route();
  window.addEventListener('hashchange', route);
}
start();
