function workForm(w){
  const editing = !!w;
  const cur = editing ? wFiles(w).filter(f => f.id) : [];   // files already on the server
  const keep = new Set(cur.map(f => f.id));
  let picked = [], mode = editing && w.kind === 'link' ? 'link' : 'files';
  $('#app').innerHTML = `
    <a class="back" href="${editing ? '#w-'+w.id : '#u-'+me().id}">${ICON.back}رجوع</a>
    <div class="panel"><h2>${editing ? 'تعديل التمرين' : 'إضافة تمرين جديد'}</h2>
      <form id="wf">
        <label for="no">رقم التمرين</label>
        <input class="in" id="no" type="number" min="1" max="999" inputmode="numeric" required value="${editing ? esc(w.exercise_no) : ''}" style="max-width:160px">
        <label>المحتوى</label>
        <div class="seg" id="seg"><button type="button" data-k="files">ملفات (حتى ${MAX_FILES})</button><button type="button" data-k="link">رابط</button></div>
        <div id="kindIn" style="margin-top:12px"></div>
        <div class="notice err" id="ferr" style="display:none;margin-top:12px"></div>
        <div class="row" style="margin-top:18px"><button class="btn" id="sbtn">${editing ? 'حفظ التعديلات' : 'نشر التمرين'}</button></div>
      </form>
    </div>`;
  const kept = () => cur.filter(f => keep.has(f.id)).length;
  const count = () => kept() + picked.length;
  const thumb = (f, file) => f.kind === 'image'
    ? `<img src="${esc(file ? URL.createObjectURL(file) : safeUrl(f.url))}" alt="">`
    : `<span class="fe">${esc(fLabel(f))}</span>`;
  const drawFiles = () => {
    $('#flist').innerHTML = cur.map(f => { const on = keep.has(f.id); return `<li class="fi${on ? '' : ' gone'}">${thumb(f)}<span class="fn" dir="auto">${esc(f.name || fLabel(f))}</span>${f.size ? `<span class="fs" dir="ltr">${fmtSize(f.size)}</span>` : ''}<button type="button" class="fx" data-cur="${esc(f.id)}">${on ? 'حذف' : 'تراجع'}</button></li>`; })
      .concat(picked.map((f, i) => `<li class="fi new">${thumb({ kind:kindOfFile(f), name:f.name }, f)}<span class="fn" dir="auto">${esc(f.name)}</span><span class="fs" dir="ltr">${fmtSize(f.size)}</span><button type="button" class="fx" data-new="${i}" aria-label="إزالة">✕</button></li>`)).join('');
    $('#fcount').textContent = `${count()} من ${MAX_FILES}`;
    $('#fadd').disabled = count() >= MAX_FILES;
    $('#flist').querySelectorAll('[data-cur]').forEach(b => b.onclick = () => {
      const id = b.dataset.cur;
      if (keep.has(id)) keep.delete(id);
      else if (count() < MAX_FILES) keep.add(id);
      else return toast(`الحد الأقصى ${MAX_FILES} ملفات للتمرين الواحد`);
      drawFiles();
    });
    $('#flist').querySelectorAll('[data-new]').forEach(b => b.onclick = () => { picked.splice(+b.dataset.new, 1); drawFiles(); });
  };
  const addPicked = list => {
    const room = MAX_FILES - count();
    if (list.length > room) toast(`الحد الأقصى ${MAX_FILES} ملفات للتمرين الواحد`);
    picked = picked.concat(list.slice(0, Math.max(0, room))); drawFiles();
  };
  const drawKind = () => {
    $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.k === mode));
    if (mode === 'link') {
      $('#kindIn').innerHTML = `<input class="in" id="url" type="url" dir="ltr" placeholder="https://…" value="${editing && w.kind === 'link' ? esc(w.url) : ''}"><div class="hint">مثال: رابط مشروع، رابط Canva، رابط محادثة أو موقع.${cur.length ? ' تحويل العمل لرابط بيحذف ملفاته.' : ''}</div>`;
      return;
    }
    $('#kindIn').innerHTML = `<div class="fbox" id="fbox"><div class="fhead"><b>الملفات</b><span class="fcount" id="fcount"></span></div>
        <ul class="flist" id="flist"></ul>
        <button type="button" class="btn ghost sm" id="fadd">+ إضافة ملفات</button><input type="file" id="fin" multiple hidden>
        <div class="hint">صور، PDF، Word، PowerPoint، Excel، ZIP، كود… أي صيغة. حتى ${MAX_FILES} ملفات للتمرين، والحجم الكلي حتى 50MB. الصور الكبيرة تنضغط تلقائيًا. أول ملف هو صورة الغلاف.</div></div>`;
    $('#fadd').onclick = () => $('#fin').click();
    $('#fin').onchange = e => { addPicked([...e.target.files]); e.target.value = ''; };
    const box = $('#fbox');
    box.ondragover = e => { e.preventDefault(); box.classList.add('drag'); };
    box.ondragleave = () => box.classList.remove('drag');
    box.ondrop = e => { e.preventDefault(); box.classList.remove('drag'); addPicked([...(e.dataTransfer?.files || [])]); };
    drawFiles();
  };
  drawKind();
  $('#seg').querySelectorAll('button').forEach(b => b.onclick = () => { mode = b.dataset.k; drawKind(); });
  $('#wf').onsubmit = async e => {
    e.preventDefault();
    const err = m => { $('#ferr').textContent = m; $('#ferr').style.display = ''; };
    $('#ferr').style.display = 'none';
    const exercise_no = parseInt($('#no').value, 10);
    if (!(exercise_no >= 1 && exercise_no <= 999)) return err('اكتب رقم تمرين صحيح.');
    const data = { exercise_no };
    if (mode === 'link') {
      const url = ($('#url').value || '').trim();
      if (!(editing && w.kind === 'link' && url === w.url)) {
        if (!/^https?:\/\/\S+\.\S+/i.test(url)) return err('اكتب رابطًا صحيحًا يبدأ بـ https://');
        data.kind = 'link'; data.url = url;
      }
    } else {
      if (count() < 1) return err('أرفق ملفًا واحدًا على الأقل.');
      if (count() > MAX_FILES) return err(`الحد الأقصى ${MAX_FILES} ملفات للتمرين الواحد.`);
      const big = picked.find(f => estSize(f) > MAX_BYTES);
      if (big) return err(`الملف "${big.name}" أكبر من 50MB.`);
      if (picked.reduce((t, f) => t + estSize(f), 0) > MAX_BYTES) return err('الحجم الكلي للملفات الجديدة أكبر من 50MB. ارفع جزءًا منها الآن والباقي بتعديل التمرين.');
      const remove = cur.filter(f => !keep.has(f.id)).map(f => f.id);
      if (!editing || w.kind === 'link' || picked.length || remove.length) { data.kind = 'files'; data.files = picked; data.remove = remove; }
    }
    const btn = $('#sbtn'), label = btn.textContent; btn.disabled = true; btn.textContent = data.files?.length ? 'جاري الرفع…' : 'جاري الحفظ…';
    const onProgress = p => { btn.textContent = p < 1 ? `جاري الرفع ${Math.round(p * 100)}%` : 'جاري الحفظ…'; };
    try {
      if (editing) { await api.updateWork(w.id, data, onProgress); toast('تم حفظ التعديلات'); await refresh(false); location.hash = '#w-' + w.id; }
      else { await api.addWork(data, onProgress); toast('تم نشر التمرين 🎉'); await refresh(false); location.hash = '#u-' + me().id; }
    } catch(er) { err(errMsg(er)); btn.disabled = false; btn.textContent = label; }
  };
}

const authTabs = on => `<div class="seg" style="margin-bottom:16px"><a class="${on === 'login' ? 'on' : ''}" href="#login">دخول</a><a class="${on === 'register' ? 'on' : ''}" href="#register">حساب جديد</a></div>`;

    <div class="panel"><h2>طلبات الانضمام</h2><div id="rlist" class="hint">جاري التحميل…</div></div>

        <div class="row" style="margin-top:10px"><button class="btn" id="mbtn">إضافة المادة</button><button type="button" class="btn ghost" id="mfileB">رفع ملف (txt / md / pdf)</button><input type="file" id="mfile" accept=".txt,.md,.pdf,text/plain,application/pdf" hidden><button type="button" class="btn ghost" id="mcancel" hidden>إلغاء التعديل</button></div>
      </form>
    </div>
    <div class="panel"><h2>الأعضاء (${S.profiles.length})</h2>
      <table class="table"><tbody>${S.profiles.map(p => `<tr><td><a class="row" href="#u-${p.id}" style="color:inherit">${avatar(p,32)}<b>${esc(p.full_name)}</b></a></td><td style="color:var(--muted)">${S.works.filter(w=>w.user_id===p.id).length} عمل</td></tr>`).join('') || '<tr><td>لا يوجد أعضاء بعد.</td></tr>'}</tbody></table>
      <p class="hint">لإزالة عضو افتح صفحته واضغط "إزالة العضو".</p>
    </div>`;
  const ung = S.works.filter(w => !S.grades[w.id]).sort((a,b) => a.created_at.localeCompare(b.created_at));
  $('#ungraded').innerHTML = ung.length ? `<table class="table"><tbody>${ung.slice(0, 30).map(w => { const o = prof(w.user_id); return `<tr><td><a class="row" href="#w-${w.id}" style="color:inherit">${avatar(o,28)}<b>${esc(o?.full_name || '')}</b></a></td><td>تمرين ${esc(w.exercise_no)}</td><td class="hint" style="margin:0">${fmtDate(w.created_at)}</td><td><a class="btn ghost sm" href="#w-${w.id}">قيّم</a></td></tr>`; }).join('')}</tbody></table>${ung.length > 30 ? `<p class="hint">و${ung.length - 30} غيرهم…</p>` : ''}`
    : '<p class="hint" style="margin:0">كل التسليمات مقيّمة ✅</p>';
  let mats = [];
  const drawMats = async () => {
    try { mats = await api.materials(); } catch(e) { $('#mlist').innerHTML = `<div class="notice err">${esc(errMsg(e))}</div>`; return; }
    $('#mlist').innerHTML = mats.length ? mats.map(m => `<div class="mitem"><div><b>${esc(m.title)}</b><div class="hint" style="margin:2px 0 0">${m.body.length.toLocaleString('ar')} حرف</div></div><div class="row" style="flex:none"><button class="btn ghost sm" data-medit="${esc(m.id)}">تعديل</button><button class="btn warn sm" data-mdel="${esc(m.id)}">حذف</button></div></div>`).join('')
      : '<p class="hint" style="margin:0">لسا ما في مواد. ضيف أول محاضرة تحت.</p>';
    $('#mlist').querySelectorAll('[data-medit]').forEach(b => b.onclick = () => {

  $('#mfile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      let text;
      if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') {
        toast('جاري استخراج النص من الـ PDF…');
        const lib = await loadPdfLib(), doc = await lib.getDocument({ data: await f.arrayBuffer() }).promise, parts = [];
        for (let i = 1; i <= Math.min(doc.numPages, 80); i++) { const c = await (await doc.getPage(i)).getTextContent(); parts.push(c.items.map(x => x.str).join(' ')); }
        text = parts.join('\n\n');
      } else text = await f.text();
      text = text.trim();
      if (!text) return toast('ما لقيت نص بالملف (ممكن يكون صور بس).');
      $('#mb').value = text.slice(0, 60000); if (!$('#mt').value) $('#mt').value = f.name.replace(/\.[^.]+$/, '');
      toast('تم تعبئة المحتوى من الملف، راجعه واحفظ.');
    } catch(er) { toast('تعذّر قراءة الملف.'); }
  };
  $('#mf').onsubmit = async e => {
    e.preventDefault(); const btn = $('#mbtn'); btn.disabled = true;
    try { await api.saveMaterial({ id:$('#mid').value || null, title:$('#mt').value.trim(), body:$('#mb').value.trim() }); toast('تم حفظ المادة'); resetMf(); drawMats(); }
    catch(er) { toast(errMsg(er)); }
    btn.disabled = false;
  };
  drawMats();
  const draw = async () => {
    let list; try { list = await api.requests(); } catch(e) { $('#rlist').innerHTML = `<div class="notice err">${esc(errMsg(e))}</div>`; return; }
    $('#rlist').innerHTML = list.length ? `<table class="table"><thead><tr><th>الاسم</th><th>اسم المستخدم والإيميل</th><th></th></tr></thead><tbody>${list.map(r => `
      <tr><td><b>${esc(r.full_name || '')}</b><div class="hint" style="margin:2px 0 0">${fmtDate(r.created_at)}</div></td>
      <td dir="ltr" style="text-align:right;word-break:break-all"><b>${esc(r.username)}</b><div class="hint" style="margin:2px 0 0">${esc(r.email)}</div></td>
      <td style="white-space:nowrap"><button class="btn sm" data-ok="${esc(r.id)}">قبول</button> <button class="btn warn sm" data-no="${esc(r.id)}">رفض</button></td></tr>`).join('')}</tbody></table>`
      : 'لا توجد طلبات جديدة. أي حد بيسجّل من صفحة "حساب جديد" بيظهر طلبه هون، وبيوصلك إيميل فيه.';
    const name = id => list.find(r => r.id === id)?.full_name || '';
    $('#rlist').querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      try { await api.approve(b.dataset.ok); toast(`تم قبول ${name(b.dataset.ok)} ✅`); await refresh(false); viewAdmin(); } catch(e) { toast(errMsg(e)); b.disabled = false; }
    });
    $('#rlist').querySelectorAll('[data-no]').forEach(b => b.onclick = async () => {
      if (!await confirmBox(`رفض طلب ${name(b.dataset.no)}؟ رح يوصله إيميل بالاعتذار، وبيقدر يقدّم من جديد.`, 'رفض')) return;
      try { await api.reject(b.dataset.no); toast('تم رفض الطلب'); renderNav(); draw(); } catch(e) { toast(errMsg(e)); }
    });
  };
  draw();
}

function viewExercise(n){

/* ---------- router ---------- */
function route(){ _route(); setTimeout(gsapView, 0); }
function _route(){
  if (S.loaded) renderNav();
  $('#nav').classList.remove('open');
  const h = location.hash.replace(/^#/, '');
  scrollTop0();
  if (!S.loaded) return;
  if (!h || h === 'home') return viewHome();
  if (h.startsWith('u-')) return viewProfile(h.slice(2));
  if (h.startsWith('w-')) return viewWork(h.slice(2));
  if (h === 'login') return viewLogin();
  if (h === 'register') return viewRegister();
  if (h === 'forgot') return viewForgot();
  if (h === 'reset') return viewReset();
  if (h === 'me') return viewMe();
  if (h === 'admin') return viewAdmin();
  if (h === 'notifs') return viewNotifs();
  if (h === 'assistant') return viewAssistant();
  if (h.startsWith('ex-')) return viewExercise(parseInt(h.slice(3), 10));
  if (h === 'add') { if (!myProfile()) return viewMe(); return workForm(null); }
  if (h.startsWith('edit-')) {
    const w = S.works.find(x => x.id === h.slice(5));
    if (!w || (w.user_id !== me()?.id && !api.isAdmin())) return notFound('لا يمكنك تعديل هذا العمل.');
    return workForm(w);
  }
  viewHome();
}

/* ---------- Lenis smooth scroll ---------- */
let lenis = null;
function initLenis(){
  if (!window.Lenis || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  try { lenis = new Lenis({ autoRaf:true, duration:1.15, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel:true }); if (window.ScrollTrigger) lenis.on('scroll', ScrollTrigger.update); } catch(e) { lenis = null; }
}
const scrollTop0 = () => lenis ? lenis.scrollTo(0, { immediate:true, force:true }) : window.scrollTo(0, 0);
const smoothTo = (target, opts={}) => {
  if (lenis) return lenis.scrollTo(target, { duration:1.3, ...opts });
  const el = typeof target === 'number' ? null : (typeof target === 'string' ? document.querySelector(target) : target);
  window.scrollTo({ top: el ? el.getBoundingClientRect().top + scrollY + (opts.offset || 0) : target, behavior:'smooth' });
};

/* ---------- GSAP: identity motion (build · signal · rise) ---------- */
let gsapCtx = null;
const HAS_GSAP = () => !!(window.gsap && window.ScrollTrigger) && !matchMedia('(prefers-reduced-motion: reduce)').matches;
function gsapInit(){
  if (!HAS_GSAP()) return;
  const plugins = [ScrollTrigger]; if (window.SplitText) plugins.push(SplitText); if (window.DrawSVGPlugin) plugins.push(DrawSVGPlugin);
  gsap.registerPlugin(...plugins);
  gsap.to('#giant', { backgroundSize:'100% 100%', ease:'none', scrollTrigger:{ trigger:'footer.ft', start:'top bottom', end:'bottom bottom', scrub:true } });
}
function gsapView(){
  if (!HAS_GSAP()) return;
  if (gsapCtx) gsapCtx.revert();
  const app = $('#app'), E = 'expo.out', split = (el) => window.SplitText ? SplitText.create(el, { type:'words,lines', mask:'lines' }) : null;
  gsapCtx = gsap.context(() => {
    const quiet = BUILD;          // the agents' build sequence owns the first visit
    /* home hero */
    const hero = app.querySelector('.hero3');
    if (hero) {
      const tl = gsap.timeline({ defaults:{ ease:E }, delay: quiet ? .2 : 0 });
      const st = split(hero.querySelector('h1'));
      if (!quiet) {
        tl.from(hero.querySelectorAll('.meta span'), { y:14, opacity:0, duration:.6, stagger:.08 });
        if (st) tl.from(st.words, { yPercent:110, duration:1, stagger:.07 }, '<.1');
        tl.from(hero.querySelector('p'), { y:24, opacity:0, duration:.9 }, '<.35').from(hero.querySelectorAll('.cta .btn'), { y:20, opacity:0, duration:.8, stagger:.08 }, '<.15');
      }
      if (window.DrawSVGPlugin) tl.from(hero.querySelector('.sb-o'), { drawSVG:0, duration:1.6, ease:'power2.inOut' }, 0);
      tl.from(hero.querySelector('.sb-i'), { scale:0, transformOrigin:'50% 50%', duration:1.1, ease:'back.out(1.6)' }, .6)
        .from(hero.querySelector('.sb-d'), { scale:0, transformOrigin:'50% 50%', duration:.6, ease:'back.out(3)' }, 1.1);
      gsap.to(hero.querySelector('.spark-big svg'), { rotate:90, duration:16, repeat:-1, ease:'none' });
      hero.querySelectorAll('.wander').forEach((c, i) => gsap.to(c, { x:'random(-150,150)', y:'random(-60,60)', duration:'random(2.2,3.4)', ease:'sine.inOut', repeat:-1, repeatRefresh:true, delay:i*.4 }));
    }
    /* marquee: endless, speeds with scroll velocity */
    const track = app.querySelector('.marq .track');
    if (track) {
      track.innerHTML += track.innerHTML;
      const loop = gsap.to(track, { xPercent:50, duration:24, ease:'none', repeat:-1 });
      ScrollTrigger.create({ trigger:track, start:'top bottom', end:'bottom top', onUpdate: s => { const d = s.direction === 1 ? 1 : -1; gsap.to(loop, { timeScale: d * Math.min(4, 1 + Math.abs(s.getVelocity()) / 500), duration:.25, overwrite:true }); gsap.to(loop, { timeScale:d, duration:1.2, delay:.25 }); } });
    }
    /* magnetic buttons */
    if (matchMedia('(hover:hover)').matches) app.querySelectorAll('.magnetic').forEach(b => {
      const xTo = gsap.quickTo(b, 'x', { duration:.5, ease:'power3' }), yTo = gsap.quickTo(b, 'y', { duration:.5, ease:'power3' });
      b.addEventListener('pointermove', e => { const r = b.getBoundingClientRect(); xTo((e.clientX - r.left - r.width/2) * .3); yTo((e.clientY - r.top - r.height/2) * .3); });
      b.addEventListener('pointerleave', () => { xTo(0); yTo(0); });
    });
    if (quiet) return;
    /* rise: section labels and headings */
    app.querySelectorAll('.sec-label, .sec-title').forEach(h => gsap.from(h, { y:24, opacity:0, duration:.8, ease:E, scrollTrigger:{ trigger:h, start:'top 92%' } }));
    app.querySelectorAll('.pinfo h1, .exhead h1, .panel > h2').forEach(h => { const st = split(h); if (st) gsap.from(st.words, { yPercent:110, duration:.9, stagger:.06, ease:E }); });
    /* build: cards enter in batches */
    const cards = app.querySelectorAll('.tcard, .work, .tl-item, .exinfo, .nitem, .stats > div, .bdg, .cm');
    if (cards.length) {
      gsap.set(cards, { y:36, opacity:0 });
      ScrollTrigger.batch(cards, { start:'top 94%', once:true, onEnter: b => gsap.to(b, { y:0, opacity:1, duration:.8, stagger:.06, ease:E, overwrite:true }) });
    }
    /* signal: exercise number and badges */
    app.querySelectorAll('.exnum').forEach(n => gsap.from(n, { rotate:-50, scale:.3, opacity:0, duration:1, ease:'back.out(1.8)' }));
    /* profile cover drifts slower than the page */
    app.querySelectorAll('.pcover').forEach(c => gsap.to(c, { backgroundPosition:'50% 100%', yPercent:12, ease:'none', scrollTrigger:{ trigger:c, start:'top top', end:'bottom top', scrub:true } }));
    /* timeline spine draws as you scroll */
    const tlEl = app.querySelector('.timeline');
    if (tlEl) gsap.fromTo(tlEl, { '--spine':0 }, { '--spine':1, ease:'none', scrollTrigger:{ trigger:tlEl, start:'top 75%', end:'bottom 60%', scrub:true } });
  }, app);
  ScrollTrigger.refresh();
}

}

/* sections get "built" by agents as they scroll into view (first visit only) */
let buildIO = null, buildQ = 0, agentN = 0;
function prepareBuild(){
  if (!BUILD) return;
  const ts = [...$('#app').querySelectorAll('.hero3, .marq, .stats > div, .sec-label, .tabs, .toolbar, #tgrid > *, #wgrid > *')].slice(0, 30);
  ts.forEach(t => t.classList.add('bld'));
  introDone.then(() => {
    if (!BUILD) return;
    buildIO = new IntersectionObserver(ents => ents.forEach(e => { if (e.isIntersecting) { buildIO.unobserve(e.target); queueBuild(e.target); } }), { threshold:.15 });
    ts.forEach(t => buildIO.observe(t));
    setTimeout(autoTour, 500);
    setTimeout(() => document.querySelectorAll('.bld').forEach(t => { t.classList.add('bld-in'); setTimeout(() => t.classList.remove('bld','bld-in'), 700); }), 20000);
  });
}
function queueBuild(t){
  const now = performance.now(), at = Math.max(now, buildQ + 170); buildQ = at;
  setTimeout(() => runBuild(t), at - now);
}
function runBuild(t){
  const r = t.getBoundingClientRect(), a = AGENTS[agentN++ % AGENTS.length];
  const f = document.createElement('div'); f.className = 'bframe';
  f.style.cssText = `top:${r.top + scrollY}px;left:${r.left + scrollX}px;width:${r.width}px;height:${r.height}px;--c:${a.c}`;
  f.innerHTML = `<svg width="${r.width}" height="${r.height}"><rect x="1" y="1" width="${Math.max(0, r.width-2)}" height="${Math.max(0, r.height-2)}" rx="16" pathLength="1"/></svg>
    <i class="bh" style="top:-4px;left:-4px"></i><i class="bh" style="top:-4px;right:-4px"></i><i class="bh" style="bottom:-4px;left:-4px"></i><i class="bh" style="bottom:-4px;right:-4px"></i>
    <span class="bsize">${Math.round(r.width)} × ${Math.round(r.height)}</span>${cursorEl(a)}`;
  document.body.appendChild(f);
  f.querySelector('.acur').animate([{ transform:`translate(${r.width - 16}px, -12px)` }, { transform:`translate(${r.width * .45}px, ${r.height * .55}px)` }, { transform:`translate(6px, ${r.height - 18}px)` }], { duration:900, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards' });
  setTimeout(() => t.classList.add('bld-in'), 420);
  setTimeout(() => f.classList.add('done'), 1050);
  setTimeout(() => { f.remove(); t.classList.remove('bld', 'bld-in'); }, 1500);
}
/* the page scrolls itself to the end once (Lenis); any touch / wheel / key stops it */
function autoTour(){
  if (!BUILD || (location.hash && location.hash !== '#home')) { BUILD = false; return; }
  const se = document.scrollingElement, from = se.scrollTop, to = se.scrollHeight - innerHeight;
  if (to - from < 50) { BUILD = false; return; }
  const dur = Math.min(13000, Math.max(4000, (to - from) / 260 * 1000));
  const ease = k => .5 - Math.cos(Math.PI * k) / 2;
  const evs = ['wheel','touchstart','pointerdown','keydown'];
  let stop = false;
  const done = () => { BUILD = false; evs.forEach(ev => removeEventListener(ev, cancel)); };
  const cancel = () => { if (stop) return; stop = true; if (lenis) { lenis.stop(); lenis.start(); } done(); };
  evs.forEach(ev => addEventListener(ev, cancel, { once:true, passive:true }));
  if (lenis) { lenis.scrollTo(to, { duration: dur / 1000, easing: ease, force:true, onComplete: () => { if (!stop) done(); } }); return; }
  const t0 = performance.now();
  const step = t => { if (stop) return; const k = Math.min(1, (t - t0) / dur); se.scrollTop = from + (to - from) * ease(k); if (k < 1) requestAnimationFrame(step); else done(); };
  requestAnimationFrame(step);
}
function setup3D(){
  if (!matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  let cur = null;
  document.addEventListener('pointermove', e => {
    const art = e.target.closest('.hero2');
    const ha = document.querySelector('.hero-art');
    if (ha) { if (art) { const r = art.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5; ha.style.transform = `rotateY(${px*22}deg) rotateX(${-py*22}deg)`; } else ha.style.transform = ''; }
    const c = e.target.closest('.tcard, .work');
    if (cur && cur !== c) { cur.style.transform = ''; cur.classList.remove('tilt'); cur = null; }
    if (!c) return;
    const r = c.getBoundingClientRect(); const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    c.classList.add('tilt'); c.style.transform = `perspective(900px) rotateY(${px*12}deg) rotateX(${-py*12}deg) translateY(-4px)`; cur = c;
  });
}
async function start(){
  gsapInit(); initLenis(); playIntro();
  addEventListener('scroll', () => $('#toTop').classList.toggle('show', scrollY > 700), { passive:true });
  $('#toTop').onclick = () => smoothTo(0, { duration:1.6 });
  let pdfT; new MutationObserver(() => { clearTimeout(pdfT); pdfT = setTimeout(hydratePdf, 60); }).observe($('#app'), { childList:true, subtree:true });
  setInterval(async () => { if (!api || !myProfile() || document.hidden) return; try { S.notifs = await api.notifications(); renderNav(); } catch(e) {} }, 60000);
  document.documentElement.dataset.theme = 'dark';
  $('#replayIntro').onclick = e => { e.preventDefault(); scrollTop0(); if (playIntro(true)) { location.hash = '#home'; route(); } };
  $('#menuBtn').onclick = () => $('#nav').classList.toggle('open');
  // رابط تعيين كلمة المرور ?reset=TOKEN
  const qs = new URLSearchParams(location.search);
  if (qs.get('reset')) { resetToken = qs.get('reset'); qs.delete('reset'); history.replaceState(null, '', location.pathname + (qs.toString() ? '?' + qs : '') + '#reset'); }
  api = DEMO ? MockApi() : LaravelApi();
  await api.init();
  api.onChange(async () => { await refresh(false); route(); });
  await refresh(false);
  route();
  window.addEventListener('hashchange', route);
}
start();
</script>
